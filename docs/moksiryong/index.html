<script>
'use strict';
const W = 1920, H = 1080;
const FONT = '"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const C = {
  bg:'#0b1220', panel:'#121b2d', panel2:'#1a2640', line:'#2b3a57', text:'#e5e7eb', sub:'#94a3b8',
  N:'#ef4444', S:'#3b82f6', field:'#fde047', A:'#fb923c', B:'#4ade80', Cc:'#c084fc',
  accent:'#38bdf8', stator:'#4b5b74', statorDark:'#3a4860', rotor:'#2a3547', gold:'#fbbf24', good:'#34d399', bad:'#f87171'
};
const PH = {A:C.A, B:C.B, C:C.Cc};
const D2R = Math.PI/180;
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const fin = (lt,s,d=0.8)=>ease((lt-s)/d);
const fout = (lt,s,d=0.8)=>1-ease((lt-s)/d);
const lerp = (a,b,t)=>a+(b-a)*t;
const P = (cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R), cy-r*Math.sin(deg*D2R)];
const font = (sz,w=500)=>`${w} ${sz}px ${FONT}`;

function txt(ctx,s,x,y,o={}){
  const {size=28,color=C.text,align='left',base='alphabetic',weight=500,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=font(size,weight); ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline=base; ctx.fillText(s,x,y); ctx.restore();
}
function wrap(ctx,s,maxW){
  const out=[];
  for(const para of s.split('\n')){
    const words=para.split(' '); let line='';
    for(const w of words){
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width<=maxW){line=test;continue;}
      if(line) out.push(line);
      if(ctx.measureText(w).width>maxW){ // break long word by chars
        let cur='';
        for(const ch of w){ if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;} else cur+=ch; }
        line=cur;
      } else line=w;
    }
    out.push(line);
  }
  return out;
}
function para(ctx,s,x,y,maxW,o={}){
  const {size=26,lh=1.55,color=C.text,weight=400,alpha=1,align='left'}=o;
  ctx.save(); ctx.font=font(size,weight);
  const lines=wrap(ctx,s,maxW);
  ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*size*lh));
  ctx.restore();
  return lines.length*size*lh;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const {color='#fff',width=4,head=16,alpha=1,dash=null}=o;
  if(alpha<=0) return;
  const a=Math.atan2(y2-y1,x2-x1), len=Math.hypot(x2-x1,y2-y1);
  const hh=Math.min(head,len*0.6);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-Math.cos(a)*hh*0.8,y2-Math.sin(a)*hh*0.8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hh*Math.cos(a-0.45),y2-hh*Math.sin(a-0.45));
  ctx.lineTo(x2-hh*Math.cos(a+0.45),y2-hh*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// arc arrow in math degrees from a1 to a2 (direction follows sign of a2-a1)
function arcArrow(ctx,cx,cy,r,a1,a2,o={}){
  const {color='#fff',width=4,head=16,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap='round';
  const dir=Math.sign(a2-a1)||1; const back=(head*0.8/r)/D2R*dir;
  ctx.beginPath(); ctx.arc(cx,cy,r,-a1*D2R,-(a2-back)*D2R,dir>0); ctx.stroke();
  const [ex,ey]=P(cx,cy,r,a2); const tang=(a2*D2R)+dir*Math.PI/2; // direction of motion (math)
  const tx=Math.cos(tang), ty=-Math.sin(tang); const ang=Math.atan2(ty,tx);
  ctx.beginPath(); ctx.moveTo(ex,ey);
  ctx.lineTo(ex-head*Math.cos(ang-0.45),ey-head*Math.sin(ang-0.45));
  ctx.lineTo(ex-head*Math.cos(ang+0.45),ey-head*Math.sin(ang+0.45)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function badge(ctx,x,y,label,color,o={}){
  const {r=24,alpha=1,dashed=false,size=26,fill=null}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=fill||color; ctx.fill();
  if(dashed){ctx.setLineDash([5,4]); ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();}
  ctx.restore();
  txt(ctx,label,x,y+1,{size,weight:900,align:'center',base:'middle',alpha,color:'#fff'});
}
// symbols ⊙ / ⊗
function curSym(ctx,x,y,r,out,o={}){
  const {alpha=1,color='#fff',bg='#0b1220'}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.lineWidth=Math.max(2,r*0.16); ctx.strokeStyle=color; ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=color;
  if(out){ ctx.beginPath(); ctx.arc(x,y,r*0.28,0,Math.PI*2); ctx.fill(); }
  else { const k=r*0.62; ctx.beginPath(); ctx.moveTo(x-k,y-k); ctx.lineTo(x+k,y+k); ctx.moveTo(x+k,y-k); ctx.lineTo(x-k,y+k); ctx.stroke(); }
  ctx.restore();
}
// polyline helper with dash animation
function poly(ctx,pts,o={}){
  const {color=C.field,width=2.5,alpha=1,dash=null,offset=0}=o; if(alpha<=0||pts.length<2) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
  if(dash){ctx.setLineDash(dash); ctx.lineDashOffset=offset;}
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke();
  ctx.restore();
}
function headAlong(ctx,pts,frac,o={}){
  if(pts.length<4) return;
  const {color=C.field,size=13,alpha=1}=o;
  let total=0; const seg=[]; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); seg.push(d); total+=d;}
  let target=total*frac, i=0; while(i<seg.length-1&&target>seg[i]){target-=seg[i];i++;}
  const a=pts[i], b=pts[i+1]; const t=seg[i]?target/seg[i]:0; const x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x+size*0.6*Math.cos(ang),y+size*0.6*Math.sin(ang));
  ctx.lineTo(x-size*0.6*Math.cos(ang)+size*0.5*Math.cos(ang+Math.PI/2),y-size*0.6*Math.sin(ang)+size*0.5*Math.sin(ang+Math.PI/2));
  ctx.lineTo(x-size*0.6*Math.cos(ang)-size*0.5*Math.cos(ang+Math.PI/2),y-size*0.6*Math.sin(ang)-size*0.5*Math.sin(ang+Math.PI/2));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function box(ctx,x,y,w,h,o={}){
  const {fill=C.panel2,stroke=C.line,r=14,alpha=1,lw=2}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; rr(ctx,x,y,w,h,r); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();} ctx.restore();
}


/* ================= 「목시룡전」 ILLUSTRATION KIT ================= */
const HEADER_TAG='2026 10월 고1 학평 국어 [31~33] · 고전소설 「목시룡전」';
const K={ryong:'#60a5fa', ho:'#fb923c', lady:'#f9a8d4', villain:'#c084fc', emp:'#fcd34d', paper:'#fbf5e6', ink:'#2b2116', skin:'#f2cfa8'};
let SEED=7; const rnd=()=>{SEED=(SEED*16807)%2147483647; return SEED/2147483647;};
const STARS=(()=>{SEED=11; const a=[]; for(let i=0;i<90;i++) a.push([30+rnd()*1140,120+rnd()*360,rnd()*1.8+0.6,rnd()*6]); return a;})();

const ROLES={
  ryong:{robe:'#1e3a8a',hat:'samo',belt:'#e5c07b'},              // 한림 시룡
  hoYoung:{robe:'#166534',hat:'samo',belt:'#e5c07b'},           // 벼슬하던 시호
  general:{robe:'#991b1b',hat:'helmet',armor:true},              // 대원수 시호
  monk:{robe:'#6b7280',hat:'bald',sash:'#9a3412'},               // 승려 시룡
  oldmonk:{robe:'#78716c',hat:'bald',sash:'#b45309',beard:true,staff:true},
  lady:{robe:'#9d174d',hat:'ladyhair',jacket:'#fbcfe8'},          // 윤부인
  emperor:{robe:'#ca8a04',hat:'ikseon',emblem:true},
  villain:{robe:'#4c1d95',hat:'samo',belt:'#a78bfa'},            // 엄숭
  petty:{robe:'#374151',hat:'samo',belt:'#6b7280'},              // 소인
  loyal:{robe:'#1f4e5f',hat:'samo',belt:'#e5c07b'},              // 충신
  child:{robe:'#0e7490',hat:'kid'},
  sick:{robe:'#a8a29e',hat:'top'}
};
function person(ctx,x,y,s,o={}){
  const R=Object.assign({},ROLES[o.role||'ryong'],o);
  const {face=1,alpha=1,bow=0,kneel=false,cry=0,t=0,tied=false,lying=false,glow=null,mouth=0}=R;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y);
  if(lying){ ctx.rotate(-Math.PI/2*face); }
  ctx.scale(s*face,s);
  if(glow){ctx.save(); ctx.shadowColor=glow; ctx.shadowBlur=40;}
  if(bow) ctx.rotate(bow*0.38);
  const top=kneel?-96:-150, bw=kneel?62:50;
  // robe
  ctx.beginPath(); ctx.moveTo(-28,top); ctx.quadraticCurveTo(-46,top+(0-top)*0.55,-bw,0); ctx.lineTo(bw,0); ctx.quadraticCurveTo(46,top+(0-top)*0.55,30,top); ctx.closePath();
  ctx.fillStyle=R.robe; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke();
  if(glow) ctx.restore();
  if(R.jacket){ // lady: jacket over skirt
    ctx.beginPath(); ctx.moveTo(-28,top); ctx.lineTo(30,top); ctx.lineTo(36,top+40); ctx.lineTo(-34,top+40); ctx.closePath(); ctx.fillStyle=R.jacket; ctx.fill();
    ctx.strokeStyle='#be123c'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(8,top+24); ctx.lineTo(16,top+52); ctx.stroke();
  }
  if(R.armor){ ctx.strokeStyle='rgba(250,204,21,.55)'; ctx.lineWidth=2;
    for(let r=0;r<5;r++) for(let c=-3;c<=3;c++){ const yy=top+24+r*20, xx=c*13+(r%2)*6; if(Math.abs(xx)>30+r*4) continue; ctx.beginPath(); ctx.arc(xx,yy,6,0,Math.PI); ctx.stroke(); }
    ctx.fillStyle='#facc15'; ctx.fillRect(-36,top+(kneel?40:70),74,7);
  }
  if(R.belt){ ctx.fillStyle=R.belt; ctx.fillRect(-38,top+(kneel?38:62),78,6); }
  if(R.emblem){ ctx.beginPath(); ctx.arc(4,top+38,15,0,Math.PI*2); ctx.fillStyle='#fde68a'; ctx.fill(); ctx.strokeStyle='#b45309'; ctx.lineWidth=2; ctx.stroke(); }
  if(R.sash){ ctx.strokeStyle=R.sash; ctx.lineWidth=14; ctx.beginPath(); ctx.moveTo(-24,top+4); ctx.lineTo(32,top+(kneel?70:96)); ctx.stroke(); }
  // collar
  ctx.strokeStyle='#f8fafc'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-10,top+1); ctx.lineTo(6,top+30); ctx.lineTo(20,top+1); ctx.stroke();
  // sleeve (hands folded)
  ctx.beginPath(); ctx.ellipse(16,top+(kneel?52:72),26,18,0.15,0,Math.PI*2); ctx.fillStyle=R.robe; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=2; ctx.stroke();
  if(tied){ ctx.strokeStyle='#a16207'; ctx.lineWidth=5; for(const d of [26,54,82]){ if(top+d>-6) continue; ctx.beginPath(); ctx.moveTo(-44,top+d); ctx.lineTo(46,top+d+4); ctx.stroke(); } }
  if(R.staff){ ctx.strokeStyle='#78350f'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(46,top-40); ctx.lineTo(46,0); ctx.stroke(); }
  // head
  const hx=4, hy=top-24;
  ctx.fillStyle=K.skin; ctx.fillRect(-4,top-8,14,10);
  ctx.beginPath(); ctx.arc(hx,hy,24,0,Math.PI*2); ctx.fillStyle=K.skin; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2; ctx.stroke();
  // hats / hair
  const hat=R.hat;
  if(hat==='samo'){ ctx.fillStyle='#111827'; ctx.beginPath(); ctx.arc(hx,hy-6,25,Math.PI,0); ctx.fill(); ctx.beginPath(); ctx.arc(hx-2,hy-24,15,Math.PI,0); ctx.fill();
    rr(ctx,hx-46,hy-22,22,8,4); ctx.fill(); rr(ctx,hx+26,hy-22,22,8,4); ctx.fill(); }
  else if(hat==='helmet'){ ctx.fillStyle='#7f1d1d'; ctx.beginPath(); ctx.arc(hx,hy-4,27,Math.PI,0); ctx.fill(); ctx.fillStyle='#facc15'; ctx.fillRect(hx-28,hy-6,56,6);
    ctx.fillStyle='#7f1d1d'; ctx.fillRect(hx-30,hy-2,14,26);
    ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.moveTo(hx,hy-30); ctx.quadraticCurveTo(hx-18,hy-62,hx-36,hy-44); ctx.quadraticCurveTo(hx-16,hy-42,hx-4,hy-28); ctx.fill();
    ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(hx,hy-31,4,0,Math.PI*2); ctx.fill(); }
  else if(hat==='ikseon'){ ctx.fillStyle='#111827'; ctx.beginPath(); ctx.arc(hx,hy-6,25,Math.PI,0); ctx.fill(); ctx.beginPath(); ctx.arc(hx,hy-22,16,Math.PI,0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx-20,hy-40,8,13,-0.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(hx-6,hy-46,8,13,-0.2,0,Math.PI*2); ctx.fill(); }
  else if(hat==='bald'){ ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(hx-4,hy-12,10,0,Math.PI*2); ctx.fill(); }
  else if(hat==='ladyhair'){ ctx.fillStyle='#111827'; ctx.beginPath(); ctx.arc(hx,hy-2,25,Math.PI*0.95,Math.PI*2.05); ctx.fill(); ctx.beginPath(); ctx.arc(hx-24,hy+6,11,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#facc15'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(hx-40,hy+6); ctx.lineTo(hx-8,hy+6); ctx.stroke(); }
  else if(hat==='kid'){ ctx.fillStyle='#111827'; ctx.beginPath(); ctx.arc(hx,hy-4,25,Math.PI,0); ctx.fill(); ctx.beginPath(); ctx.arc(hx-22,hy+2,8,0,Math.PI*2); ctx.fill(); }
  else if(hat==='top'){ ctx.fillStyle='#292524'; ctx.beginPath(); ctx.arc(hx,hy-4,25,Math.PI,0); ctx.fill(); }
  if(R.beard){ ctx.fillStyle='#f5f5f4'; ctx.beginPath(); ctx.moveTo(hx+2,hy+14); ctx.lineTo(hx+22,hy+12); ctx.lineTo(hx+10,hy+52); ctx.closePath(); ctx.fill();
    ctx.fillRect(hx+8,hy-12,12,3); }
  // face
  ctx.strokeStyle='#1f2937'; ctx.fillStyle='#1f2937'; ctx.lineWidth=2.6;
  if(cry>0){ ctx.beginPath(); ctx.arc(hx+12,hy-2,5,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx+6,hy-12); ctx.lineTo(hx+17,hy-9); ctx.stroke();
    for(let k=0;k<3;k++){ const ph=((t*1.1+k/3)%1); ctx.save(); ctx.globalAlpha*=cry*(1-ph); ctx.fillStyle='#7dd3fc';
      const ty=hy+2+ph*46; ctx.beginPath(); ctx.moveTo(hx+14,ty-6); ctx.quadraticCurveTo(hx+20,ty+2,hx+14,ty+4); ctx.quadraticCurveTo(hx+8,ty+2,hx+14,ty-6); ctx.fill(); ctx.restore(); }
  } else { ctx.beginPath(); ctx.arc(hx+12,hy-3,3.2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(hx+6,hy-11); ctx.lineTo(hx+17,hy-12); ctx.stroke(); }
  if(mouth>0){ ctx.beginPath(); ctx.ellipse(hx+16,hy+11,3.5,3+mouth*3,0,0,Math.PI*2); ctx.fill(); }
  else if(!R.beard){ ctx.beginPath(); ctx.moveTo(hx+11,hy+11); ctx.lineTo(hx+19,hy+10); ctx.stroke(); }
  ctx.restore();
  if(R.label){ ctx.save(); ctx.font=font(22,700); const w=ctx.measureText(R.label).width+24; ctx.restore();
    const ly=lying?y+30:y+16;
    box(ctx,x-w/2,ly,w,34,{fill:'rgba(15,23,42,.88)',stroke:R.labelColor||'#fff',r:17,alpha}); txt(ctx,R.label,x,ly+25,{size:22,weight:700,align:'center',color:R.labelColor||'#fff',alpha}); }
}
function bubble(ctx,x,y,w,text,o={}){
  const {tail=null,size=25,who=null,whoColor='#334155',alpha=1,fill=K.paper,ink=K.ink,think=false}=o;
  if(alpha<=0) return 0;
  ctx.save(); ctx.font=font(size,500); const lines=wrap(ctx,text,w-36); ctx.restore();
  const head=who?30:0, h=lines.length*size*1.45+28+head;
  ctx.save(); ctx.globalAlpha*=alpha;
  if(tail&&!think){ const bx=clamp(tail[0],x+30,x+w-30), by=tail[1]>y+h/2?y+h-2:y+2;
    ctx.beginPath(); ctx.moveTo(bx-16,by); ctx.lineTo(tail[0],tail[1]); ctx.lineTo(bx+16,by); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }
  if(tail&&think){ for(let k=1;k<=3;k++){ const f=k/4; ctx.beginPath(); ctx.arc(lerp(tail[0],x+w/2,1-f*0.9),lerp(tail[1],y+h,1-f*0.9),4+k*3,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); } }
  rr(ctx,x,y,w,h,think?h/2.6:18); ctx.fillStyle=fill; ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;

function measureLines(ctx,s,maxW,size){ctx.save(); ctx.font=font(size,700); const n=wrap(ctx,s,maxW).length; ctx.restore(); return n;}

const isRender=/[?&]render/.test(location.search);
window.renderAt=renderAt; window.TOTAL=TOTAL; window.STARTS=STARTS;
if(isRender){ document.documentElement.classList.add('render'); }
else {
  let T=0, playing=false, last=null;
  const btn=document.getElementById('play'), seek=document.getElementById('seek'), time=document.getElementById('time'), chips=document.getElementById('chips');
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  SCENES.forEach((s,k)=>{const b=document.createElement('button'); b.textContent=s.short; b.onclick=()=>{T=STARTS[k]+0.01; draw();}; chips.appendChild(b);});
  function draw(){ renderAt(T); seek.value=Math.round(T/TOTAL*1000); time.textContent=fmt(T)+' / '+fmt(TOTAL);
    const [i]=sceneAt(T); [...chips.children].forEach((c,k)=>c.classList.toggle('on',k===i)); }
  function loop(ts){ if(playing){ if(last!=null) T+= (ts-last)/1000; last=ts; if(T>=TOTAL){T=TOTAL-0.01; setPlay(false);} draw(); requestAnimationFrame(loop);} }
  function setPlay(p){ playing=p; btn.textContent=p?'⏸ 일시정지':'▶ 재생'; last=null; if(p){ if(T>=TOTAL-0.05) T=0; requestAnimationFrame(loop);} }
  btn.onclick=()=>setPlay(!playing);
  seek.oninput=()=>{T=seek.value/1000*TOTAL; draw();};
  document.getElementById('prev').onclick=()=>{const [i,lt]=sceneAt(T); T=STARTS[Math.max(0,lt<1.5?i-1:i)]+0.01; draw();};
  document.getElementById('next').onclick=()=>{const [i]=sceneAt(T); T=STARTS[Math.min(SCENES.length-1,i+1)]+0.01; draw();};
  addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); setPlay(!playing);} if(e.code==='ArrowRight'){T=Math.min(TOTAL-0.01,T+5); draw();} if(e.code==='ArrowLeft'){T=Math.max(0,T-5); draw();} });
  (document.fonts?document.fonts.load('700 30px "Noto Sans KR"').catch(()=>{}):Promise.resolve()).then(()=>draw());
  draw();
}
</script>
