<div id="wrap">
  <div id="stageBox"><div id="stage">
    <div id="hdr"><div id="badge">0</div><div id="title"></div><div id="tag">2026 10월 고1 학평 국어 [11~14] · 3D 영구자석 동기전동기</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
'use strict';
const W = 1920, H = 1080;
const FONT = '"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const C = {
  bg:'#0b1220', panel:'#121b2d', panel2:'#1a2640', line:'#2b3a57', text:'#e5e7eb', sub:'#94a3b8',
  N:'#ef4444', S:'#3b82f6', field:'#fde047', A:'#fb923c', B:'#4ade80', Cc:'#c084fc',
  accent:'#38bdf8', stator:'#4b5b74', statorDark:'#3a4860', rotor:'#2a3547', gold:'#fbbf24', good:'#34d399', bad:'#f87171'
};
const PH = {A:C.A, B:C.B, C:C.Cc};
const D2R = Math.PI/180;
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const fin = (lt,s,d=0.8)=>ease((lt-s)/d);
const fout = (lt,s,d=0.8)=>1-ease((lt-s)/d);
const lerp = (a,b,t)=>a+(b-a)*t;
const P = (cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R), cy-r*Math.sin(deg*D2R)];
const font = (sz,w=500)=>`${w} ${sz}px ${FONT}`;

function txt(ctx,s,x,y,o={}){
  const {size=28,color=C.text,align='left',base='alphabetic',weight=500,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=font(size,weight); ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline=base; ctx.fillText(s,x,y); ctx.restore();
}
function wrap(ctx,s,maxW){
  const out=[];
  for(const para of s.split('\n')){
    const words=para.split(' '); let line='';
    for(const w of words){
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width<=maxW){line=test;continue;}
      if(line) out.push(line);
      if(ctx.measureText(w).width>maxW){ // break long word by chars
        let cur='';
        for(const ch of w){ if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;} else cur+=ch; }
        line=cur;
      } else line=w;
    }
    out.push(line);
  }
  return out;
}
function para(ctx,s,x,y,maxW,o={}){
  const {size=26,lh=1.55,color=C.text,weight=400,alpha=1,align='left'}=o;
  ctx.save(); ctx.font=font(size,weight);
  const lines=wrap(ctx,s,maxW);
  ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*size*lh));
  ctx.restore();
  return lines.length*size*lh;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const {color='#fff',width=4,head=16,alpha=1,dash=null}=o;
  if(alpha<=0) return;
  const a=Math.atan2(y2-y1,x2-x1), len=Math.hypot(x2-x1,y2-y1);
  const hh=Math.min(head,len*0.6);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-Math.cos(a)*hh*0.8,y2-Math.sin(a)*hh*0.8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hh*Math.cos(a-0.45),y2-hh*Math.sin(a-0.45));
  ctx.lineTo(x2-hh*Math.cos(a+0.45),y2-hh*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// arc arrow in math degrees from a1 to a2 (direction follows sign of a2-a1)
function arcArrow(ctx,cx,cy,r,a1,a2,o={}){
  const {color='#fff',width=4,head=16,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap='round';
  const dir=Math.sign(a2-a1)||1; const back=(head*0.8/r)/D2R*dir;
  ctx.beginPath(); ctx.arc(cx,cy,r,-a1*D2R,-(a2-back)*D2R,dir>0); ctx.stroke();
  const [ex,ey]=P(cx,cy,r,a2); const tang=(a2*D2R)+dir*Math.PI/2; // direction of motion (math)
  const tx=Math.cos(tang), ty=-Math.sin(tang); const ang=Math.atan2(ty,tx);
  ctx.beginPath(); ctx.moveTo(ex,ey);
  ctx.lineTo(ex-head*Math.cos(ang-0.45),ey-head*Math.sin(ang-0.45));
  ctx.lineTo(ex-head*Math.cos(ang+0.45),ey-head*Math.sin(ang+0.45)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function badge(ctx,x,y,label,color,o={}){
  const {r=24,alpha=1,dashed=false,size=26,fill=null}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=fill||color; ctx.fill();
  if(dashed){ctx.setLineDash([5,4]); ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();}
  ctx.restore();
  txt(ctx,label,x,y+1,{size,weight:900,align:'center',base:'middle',alpha,color:'#fff'});
}
// symbols ⊙ / ⊗
function curSym(ctx,x,y,r,out,o={}){
  const {alpha=1,color='#fff',bg='#0b1220'}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.lineWidth=Math.max(2,r*0.16); ctx.strokeStyle=color; ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=color;
  if(out){ ctx.beginPath(); ctx.arc(x,y,r*0.28,0,Math.PI*2); ctx.fill(); }
  else { const k=r*0.62; ctx.beginPath(); ctx.moveTo(x-k,y-k); ctx.lineTo(x+k,y+k); ctx.moveTo(x+k,y-k); ctx.lineTo(x-k,y+k); ctx.stroke(); }
  ctx.restore();
}
// polyline helper with dash animation
function poly(ctx,pts,o={}){
  const {color=C.field,width=2.5,alpha=1,dash=null,offset=0}=o; if(alpha<=0||pts.length<2) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
  if(dash){ctx.setLineDash(dash); ctx.lineDashOffset=offset;}
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke();
  ctx.restore();
}
function headAlong(ctx,pts,frac,o={}){
  if(pts.length<4) return;
  const {color=C.field,size=13,alpha=1}=o;
  let total=0; const seg=[]; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); seg.push(d); total+=d;}
  let target=total*frac, i=0; while(i<seg.length-1&&target>seg[i]){target-=seg[i];i++;}
  const a=pts[i], b=pts[i+1]; const t=seg[i]?target/seg[i]:0; const x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x+size*0.6*Math.cos(ang),y+size*0.6*Math.sin(ang));
  ctx.lineTo(x-size*0.6*Math.cos(ang)+size*0.5*Math.cos(ang+Math.PI/2),y-size*0.6*Math.sin(ang)+size*0.5*Math.sin(ang+Math.PI/2));
  ctx.lineTo(x-size*0.6*Math.cos(ang)-size*0.5*Math.cos(ang+Math.PI/2),y-size*0.6*Math.sin(ang)-size*0.5*Math.sin(ang+Math.PI/2));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function box(ctx,x,y,w,h,o={}){
  const {fill=C.panel2,stroke=C.line,r=14,alpha=1,lw=2}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; rr(ctx,x,y,w,h,r); ctx.fillStyle=fill; ctx.fill(); if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();} ctx.restore();
}


const PHDIR={A:0,B:-120,C:120}; // field direction (math deg) at centre for +current
function currentsAt(theta){ // theta deg ; returns {A,B,C} in units (max 300)
  return {A:300*Math.sin(theta*D2R), B:300*Math.sin((theta-120)*D2R), C:300*Math.sin((theta+120)*D2R)};
}
function resultant(I){
  let x=0,y=0; for(const k of ['A','B','C']){x+=I[k]*Math.cos(PHDIR[k]*D2R); y+=I[k]*Math.sin(PHDIR[k]*D2R);} return [x,y];
}

function graph3(ctx,x0,y0,w,h,theta,o={}){
  const {alpha=1,dcMorph=1,bProg=1,cProg=1,cursor=true}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha;
  box(ctx,x0-70,y0-h/2-60,w+110,h+150,{fill:'#111a2c'});
  const sy=(h/2)/300; const X=t=>x0+w*t/360, Y=v=>y0-v*sy;
  ctx.strokeStyle='#334155'; ctx.lineWidth=1.5; ctx.setLineDash([5,5]);
  for(const v of [-300,-150,150,300]){ctx.beginPath(); ctx.moveTo(x0,Y(v)); ctx.lineTo(x0+w,Y(v)); ctx.stroke(); txt(ctx,String(v),x0-12,Y(v)+7,{size:18,align:'right',color:C.sub});}
  for(const t of [90,180,270,360]){ctx.beginPath(); ctx.moveTo(X(t),Y(300)); ctx.lineTo(X(t),Y(-300)); ctx.stroke();}
  ctx.setLineDash([]); ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,Y(0)); ctx.lineTo(x0+w+10,Y(0)); ctx.moveTo(x0,Y(320)); ctx.lineTo(x0,Y(-320)); ctx.stroke();
  txt(ctx,'0',x0-12,Y(0)+7,{size:18,align:'right',color:C.sub});
  ['t₀','t₁','t₂','t₃','t₄'].forEach((s,i)=>txt(ctx,s,X(i*90),Y(-300)+34,{size:24,align:'center',weight:700}));
  txt(ctx,'전류의 세기(I)',x0-50,y0-h/2-25,{size:20,color:C.sub});
  txt(ctx,'시간',x0+w+18,Y(0)+6,{size:20,color:C.sub});
  const curve=(fn,col,dash,prog)=>{ if(prog<=0) return; ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=4; if(dash) ctx.setLineDash(dash); ctx.beginPath();
    for(let t=0;t<=360*prog;t+=2){const v=fn(t); t?ctx.lineTo(X(t),Y(v)):ctx.moveTo(X(t),Y(v));} ctx.stroke(); ctx.restore(); };
  curve(t=>lerp(220,currentsAt(t).A,dcMorph),C.A,null,1);
  if(dcMorph<0.6) txt(ctx,'직류 (배터리)',X(250),Y(220)-14,{size:22,color:C.A,weight:700,alpha:1-dcMorph/0.6});
  curve(t=>currentsAt(t).B,C.B,[14,9],bProg);
  curve(t=>currentsAt(t).C,C.Cc,[4,7],cProg);
  // legend
  const ly=Y(-300)+72;
  [['A–a 쌍',C.A,null],['B–b 쌍',C.B,[14,9]],['C–c 쌍',C.Cc,[4,7]]].forEach(([s,col,d],i)=>{
    const lx=x0-30+i*140; ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=4; if(d) ctx.setLineDash(d); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+40,ly); ctx.stroke(); ctx.restore();
    txt(ctx,s,lx+48,ly+7,{size:20,color:col,weight:700});
  });
  if(cursor){
    const t=((theta%360)+360)%360; const tt=(theta>=360&&t<0.01)?360:t;
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(X(tt),Y(320)); ctx.lineTo(X(tt),Y(-320)); ctx.stroke();
    const I=currentsAt(tt);
    for(const [k,col] of [['A',C.A],['B',C.B],['C',C.Cc]]){ctx.beginPath(); ctx.arc(X(tt),Y(I[k]),8,0,Math.PI*2); ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();}
  }
  ctx.restore();
}

function gauge(ctx,cx,cy,r,v,o={}){
  const {limit=null,alpha=1}=o; ctx.save(); ctx.globalAlpha*=alpha;
  ctx.lineWidth=18; ctx.strokeStyle='#1f2937'; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25); ctx.stroke();
  const f=clamp(v/220); ctx.strokeStyle=C.accent; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*(0.75+1.5*f)); ctx.stroke();
  if(limit){const lf=limit.v/220, a=Math.PI*(0.75+1.5*lf); ctx.save(); ctx.globalAlpha*=limit.alpha; ctx.strokeStyle=C.bad; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(r-28),cy+Math.sin(a)*(r-28)); ctx.lineTo(cx+Math.cos(a)*(r+28),cy+Math.sin(a)*(r+28)); ctx.stroke(); ctx.restore();
    txt(ctx,'속도 제한',cx+Math.cos(a)*(r+40)+30,cy+Math.sin(a)*(r+40),{size:20,weight:700,color:C.bad,alpha:limit.alpha,align:'center'});}
  const a=Math.PI*(0.75+1.5*f); ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*(r-22),cy+Math.sin(a)*(r-22)); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
  txt(ctx,'회전 속도',cx,cy+r*0.55,{size:22,align:'center',color:C.sub,alpha});
  txt(ctx,String(Math.round(v)),cx,cy+r*0.55+40,{size:34,weight:900,align:'center',alpha});
}

/* ================= 3D PMSM ================= */
const L=3.2, RO=3.0, RI=1.95, SD=0.42, RR=1.78, NSLOT=36, WZ=-6.4;
const PHC={A:0xfb923c,B:0x4ade80,C:0xc084fc};

const shape=new THREE.Shape(); shape.absarc(0,0,RO,0,Math.PI*2,false);
const hole=new THREE.Path(); const hw=0.11;
{ const pts=[]; for(let k=0;k<NSLOT;k++){ const a=rad(5+10*k), w=hw/RI, a0=rad(5+10*(k-1))+w;
    for(let s=0;s<=6;s++){ const t=a0+(a-w-a0)*s/6; pts.push([RI*Math.cos(t),RI*Math.sin(t)]); }
    const ux=Math.cos(a), uy=Math.sin(a), tx=-uy, ty=ux;
    pts.push([RI*ux-hw*tx,RI*uy-hw*ty],[(RI+SD)*ux-hw*tx,(RI+SD)*uy-hw*ty],[(RI+SD)*ux+hw*tx,(RI+SD)*uy+hw*ty],[RI*ux+hw*tx,RI*uy+hw*ty]); }
  hole.moveTo(pts[0][0],pts[0][1]); for(const p of pts.slice(1)) hole.lineTo(p[0],p[1]); hole.closePath(); }

for(let k=0;k<NSLOT;k++){ const a=5+10*k, r=nearestReg(a);
  const m=new THREE.MeshStandardMaterial({color:0x6b4a2f,metalness:0.35,roughness:0.55,emissive:PHC[r.ph],emissiveIntensity:0});
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.18,SD*0.78,L*0.995),m); b.position.set((RI+SD*0.52)*Math.cos(rad(a)),(RI+SD*0.52)*Math.sin(rad(a)),0); b.rotation.z=rad(a-90);

// end turns + loop paths
const RW=RI+SD*0.52;
function regionAngle(ph,cap){ return REG.find(r=>r.ph===ph&&r.cap===cap).a; }
const pairs={};
['A','B','C'].forEach((ph,i)=>{
  const aU=regionAngle(ph,true), aL=regionAngle(ph,false); const hgt=0.35+i*0.26, rr=RW+0.12*i;
  const arc=(z0,dirSign,from,to)=>{ const pts=[]; const span=((to-from)%360+360)%360; const N=40;
    pts.push(new THREE.Vector3(RW*Math.cos(rad(from)),RW*Math.sin(rad(from)),z0));
    for(let s=0;s<=N;s++){ const t=s/N, ang=from+span*t; const lift=Math.sin(Math.PI*Math.min(1,Math.max(0,t)))*0.0; const r=lerp(RW,rr,Math.sin(Math.PI*t)*1); pts.push(new THREE.Vector3(r*Math.cos(rad(ang)),r*Math.sin(rad(ang)),z0+dirSign*(hgt*Math.min(1,Math.sin(Math.PI*t)*3)))); }
    pts.push(new THREE.Vector3(RW*Math.cos(rad(to)),RW*Math.sin(rad(to)),z0)); return pts; };
  const front=arc(L/2,1,aU,aL), back=arc(-L/2,-1,aL,aU);

  pairs[ph]={mat,curve,dots,dm,phase:0};
});

function makeArrow(col,thick=0.09){ const g=new THREE.Group(); const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1,depthTest:false});
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(thick,thick,1,16),m); const hd=new THREE.Mesh(new THREE.ConeGeometry(thick*2.6,thick*6,20),m); g.add(sh); g.add(hd); g.userData={sh,hd,m,thick}; g.renderOrder=10; sh.renderOrder=10; hd.renderOrder=10; scene.add(g); return g; }
const _up=new THREE.Vector3(0,1,0);
function setArrow(g,from,to,alpha){ g.visible=alpha>0.01; if(!g.visible) return; g.userData.m.opacity=alpha; const d=new THREE.Vector3().subVectors(to,from); const len=d.length(); const hl=g.userData.thick*6;
  g.position.copy(from); g.quaternion.setFromUnitVectors(_up,d.clone().normalize()); const sl=Math.max(0.01,len-hl); g.userData.sh.scale.set(1,sl,1); g.userData.sh.position.y=sl/2; g.userData.hd.position.y=sl+hl/2; }

    for(let k=0;k<2;k++){ const c=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,12),m); ringG.add(c); set.cones.push({c,r,z,cx,cy,k}); } }

  const v=pos.clone().project(camera); const x=(v.x+1)/2*1240, y=(1-v.y)/2*790; const on=alpha>0.01&&v.z<1&&x>-50&&x<1290&&y>-30&&y<820;
  el.style.display=on?'block':'none'; if(on){ el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%)`; el.style.opacity=alpha; } el._used=true; }
const V=(x,y,z)=>new THREE.Vector3(x,y,z); const PA=(r,a,z)=>V(r*Math.cos(rad(a)),r*Math.sin(rad(a)),z);

/* ---------- apply state ---------- */
const DEF={statorOp:1,explode:0,rotorOp:1,wheelOp:1,coils:1,regions:0,slotHL:0,gapHL:0,statorGlow:0,I:null,dots:0,rotorAngle:-90,em:null,result:0,rings:0,curArrows:0,pull:0,push:0,wobble:0,cancel:0,labels:{},hud:null,t:0};
let lastT=null;
function apply(st,T){
  const dt=lastT===null?0:clamp(T-lastT,0,0.1); lastT=T;
  statorG.position.z=st.explode*5.2;
  stMat.opacity=st.statorOp; stMat.depthWrite=st.statorOp>0.95; stMesh.visible=st.statorOp>0.01;
  glowMat.opacity=st.statorGlow*0.18;
  slotHLMat.opacity=st.slotHL*0.85;
  for(const b of bars){ const m=b.mesh.material; const v=st.I?st.I[b.reg.ph]*(b.reg.cap?1:-1)/300:0; const k=Math.max(st.regions,Math.min(1,Math.abs(v)*1.5)); m.color.copy(_copper).lerp(_phc[b.reg.ph],k*0.85); m.emissiveIntensity=(st.regions*0.25+Math.abs(v)*0.9)*st.coils; b.mesh.visible=st.coils>0.01; }
  for(const ph of ['A','B','C']){ const p=pairs[ph]; const I=st.I?st.I[ph]/300:0; p.mat.opacity=st.coils; p.mat.emissiveIntensity=0.15+Math.max(st.regions*0.5,Math.abs(I)*1.0); p.phase+=I*dt*0.55;
    p.dm.opacity=st.dots*Math.min(1,Math.abs(I)*1.6+0.0); p.dots.forEach((d,k)=>{ d.visible=p.dm.opacity>0.02; if(!d.visible) return; const u=((k/p.dots.length+p.phase)%1+1)%1; d.position.copy(p.curve.getPointAt(u)); }); }
  roMat.opacity=st.rotorOp; roMat.depthWrite=st.rotorOp>0.95; nMat.opacity=sMat.opacity=Math.max(st.rotorOp,0)*1; roMesh.visible=st.rotorOp>0.01; magG.visible=st.rotorOp>0.01; spN.visible=spS.visible=st.rotorOp>0.3;
  rotorG.rotation.z=rad(st.rotorAngle); wheelG.rotation.z=rad(st.rotorAngle);
  tireMat.opacity=rimMat.opacity=st.wheelOp; wheelG.visible=st.wheelOp>0.01; shaft.visible=st.wheelOp>0.01||st.rotorOp>0.01; shaftMat.opacity=Math.max(st.wheelOp,st.rotorOp);
  gapMat.opacity=st.gapHL*0.75;
  const wob=st.wobble?(Math.sin(T*23)*14+Math.sin(T*37)*9)*st.wobble:0;
  if(st.em&&st.em.alpha>0.01){ emG.visible=true; emG.rotation.z=rad(st.em.angle+wob); poleN.material.opacity=poleS.material.opacity=0.45*st.em.alpha; } else emG.visible=false;
  const ea=st.em?st.em.angle:0, zf=L/2+0.25;
  setArrow(resArrow,PA(RI*0.8,ea+180,zf),PA(RI*0.8,ea,zf),st.result*0.9);
  const ra=st.rotorAngle;
  setArrow(pullArrow,PA(RR*0.72,ra,zf+0.05),PA(RI*0.95,ra-62,zf+0.05),st.pull);
  setArrow(pushArrow,PA(RI*0.95,ra+62,zf+0.05),PA(RR*0.72,ra,zf+0.05),st.push);
  setArrow(pmArrow,PA(RR*0.35,ra+14,zf+0.1),PA(RI+0.35,ra+14,zf+0.1),st.cancel);
  setArrow(emArrow,PA(RI+0.35,ra-14,zf+0.1),PA(RR*0.35,ra-14,zf+0.1),st.cancel);
  setArrow(curArrows[0],PA(RI+SD+0.25,90,-L/2-0.3).add(V(0,0,0)),PA(RI+SD+0.25,90,L/2+0.9),st.curArrows);
  setArrow(curArrows[1],PA(RI+SD+0.25,-90,L/2+0.3),PA(RI+SD+0.25,-90,-L/2-0.9),st.curArrows);
  ringSets.forEach(set=>{ set.rings.forEach(r=>{ r.material.opacity=st.rings*0.85; r.visible=st.rings>0.01; });
    set.cones.forEach(o=>{ o.c.visible=st.rings>0.01; if(!o.c.visible) return; const ph=T*1.4*set.dir+o.k*Math.PI+o.r*3; o.c.position.set(o.cx+o.r*Math.cos(ph),o.cy+o.r*Math.sin(ph),o.z); o.c.rotation.set(0,0,ph+(set.dir>0?0:Math.PI)); }); });
  // labels
  for(const k in labelEls) labelEls[k]._used=false;
  const lb=st.labels||{}; const ez=statorG.position.z;
  if(lb.stator) label('stator','고정자 (원통형)','#38bdf8',PA(RO+0.4,40,L/2+ez),lb.stator);
  if(lb.rotor) label('rotor','회전자','#e2e8f0',PA(RR*0.9,200,L/2+0.2),lb.rotor);
  if(lb.magnet) label('magnet','영구자석 (N 빨강 · S 파랑)','#fca5a5',PA(1.0,ra,L/2+0.3),lb.magnet);
  if(lb.shaft) label('shaft','중심축','#e2e8f0',V(0,0.5,(L/2+WZ)/2-0.6),lb.shaft);
  if(lb.wheel) label('wheel','바퀴','#e2e8f0',V(0,2.4,WZ),lb.wheel);
  if(lb.gap) label('gap','약간의 틈','#fde047',PA((RR+RI)/2,-40,L/2+0.1),lb.gap);
  if(lb.slot) label('slot','슬롯: 한쪽 밑면 → 다른 쪽 밑면','#fde047',PA(RI+0.2,128,-L/2+ez),lb.slot);
  if(lb.regions) for(const r of REG){ const c='#'+PHC[r.ph].toString(16).padStart(6,'0'); label('reg'+r.n,r.n,c,PA(RO+0.45,r.a,L/2+ez),lb.regions); }
  if(lb.em&&st.em){ label('emN','전자석 N','#f87171',PA(RI-0.45,st.em.angle+wob,L/2+0.4),lb.em); label('emS','전자석 S','#60a5fa',PA(RI-0.45,st.em.angle+180+wob,L/2+0.4),lb.em); }
  if(lb.ringA){ label('ringA','⊙ 전류가 나옴 → 반시계','#fde047',PA(RW,90,L/2+0.9),lb.ringA); label('ringa','⊗ 전류가 들어감 → 시계','#fde047',PA(RW,-90,L/2+0.9),lb.ringA); }
  if(lb.pull) { label('pull','인력 (당김)','#34d399',PA(RI*0.95,ra-70,zf),lb.pull); }
  if(lb.push) { label('push','척력 (밀어냄)','#f87171',PA(RI*0.95,ra+70,zf),lb.push); }
  if(lb.cancel){ label('cancel','방향 반대 → 상쇄','#fde047',PA(RI*0.55,ra,zf+0.3),lb.cancel); }
  for(const k in labelEls) if(!labelEls[k]._used) labelEls[k].style.display='none';
}

 {title:'한눈에 정리',short:'정리',dur:14,
  quote:'그러면 전류가 다시 원활하게 흐르면서 전동기가 빠르게 회전할 수 있게 된다.',
  bullets:[[0,'구성: 영구자석 회전자 + 슬롯과 전선 다발이 있는 고정자'],[2,'전자석 형성: 전류 → 오른나사 법칙 → N·S극'],[4,'회전력 제어: 3상 교류 → 회전하는 전자석 → 90° 앞에서 당기고 뒤에서 밂'],[6,'고속: 역기전력 ↑ → N극–S극 겹치는 제어로 상쇄'],[9,'아래 “직접 탐색”에서 마음대로 돌려 보세요!']],
  steps:[[0,'지금까지 본 흐름: 구성 → 전자석 형성 → 회전하는 자기장 → 고속에서의 역기전력 제어. 아래 ‘직접 탐색’에서 직접 돌려 보세요!']],
  cam:[[0,{az:0.6,el:0.3,dist:16,tz:-0.5}],[14,{az:2.2,el:0.35,dist:17,tz:-1}]],
  state(lt){ const th=lt*60; return {I:currentsAt(th),dots:1,rotorAngle:-th,em:{angle:90-th,alpha:0.8}}; }}
];
const TSTART=[]; let TTOTAL=0; for(const s of TOUR){ TSTART.push(TTOTAL); TTOTAL+=s.dur; }
function camAt(keys,lt){ let a=keys[0],b=keys[keys.length-1]; for(let i=0;i<keys.length-1;i++){ if(lt>=keys[i][0]&&lt<keys[i+1][0]){a=keys[i];b=keys[i+1];break;} } if(lt>=keys[keys.length-1][0]) a=b=keys[keys.length-1];
  const u=a===b?0:ease((lt-a[0])/(b[0]-a[0])); const o={}; for(const k of ['az','el','dist','tx','ty','tz']) o[k]=lerp(a[1][k]||0,b[1][k]||0,u); return o; }

/* ================= EXPLORE ================= */
const EXPLORE={
  '구조':{cap:'마우스(손가락)로 끌어 돌리고, 휠로 확대해 보세요. “분해 보기”로 고정자를 빼면 영구자석이 붙은 회전자와 중심축·바퀴가 보여요.',scene:1},
  '전자석 형성':{cap:'A–a 구역에만 전류를 흘린 상태예요. 전류(하얀 점)가 나오는 A 구역 둘레엔 반시계, 들어가는 a 구역 둘레엔 시계 방향 자기장이 생기고, 그 사이에 전자석이 만들어져요.',scene:2},
  '회전 자기장':{cap:'세 쌍의 구역에 시간차를 둔 교류가 흐르며 전자석(빨강 N · 파랑 S)이 회전하고, 영구자석이 90° 뒤에서 따라 돌아요. 속도를 바꿔 보세요.',scene:3},
  '고속 · 역기전력':{cap:'속도를 올리면 역기전력이 커져 전류가 줄어들고, 130 근처에서 속도가 제한돼요. “약계자 제어”를 켜면 영구자석 N극과 전자석 S극이 겹쳐 역기전력이 줄어요.',scene:4}};
const ex={name:'구조',theta:0,rot:0,speed:1,explode:0,statorOp:1,labels:true,fw:false,fwk:0,vel:60,clock:0};
function exploreState(dt){ ex.clock+=dt; const n=ex.name; let st;
  if(n==='구조'){ ex.rot+=dt*30*ex.speed; st={explode:ex.explode,statorOp:ex.statorOp,rotorAngle:-90-ex.rot,regions:0.6,labels:ex.labels?{stator:1,rotor:1,magnet:1,shaft:1,wheel:1,gap:ex.explode<0.1?1:0,regions:1}:{}}; }
  else if(n==='전자석 형성'){ st={statorOp:Math.min(ex.statorOp,0.35),explode:0,rotorOp:0,wheelOp:0.25,I:{A:300,B:0,C:0},dots:1,rings:1,curArrows:1,result:1,em:{angle:0,alpha:1},labels:ex.labels?{ringA:1,em:1,regions:1}:{}}; }
  else if(n==='회전 자기장'){ ex.theta+=dt*60*ex.speed; const th=ex.theta; st={statorOp:Math.min(ex.statorOp,0.55),explode:ex.explode,I:currentsAt(th),dots:1,rotorAngle:-th,em:{angle:90-th,alpha:1},pull:1,push:1,hud:{type:'graph',theta:th},labels:ex.labels?{regions:1,em:1,pull:1,push:1}:{}}; }
  else { const target=ex.vel; ex.fwk+=((ex.fw?1:0)-ex.fwk)*Math.min(1,dt*1.5); const cap=lerp(130,200,ex.fwk); const sp=Math.min(target,cap); ex.speedNow=(ex.speedNow??0)+(sp-(ex.speedNow??0))*Math.min(1,dt*1.2); ex.rot+=dt*ex.speedNow*2.4;
    const emf=ex.speedNow/130*95*lerp(1,0.45,ex.fwk); const instab=clamp((ex.speedNow-80)/40)*(1-ex.fwk*0.8);
    st={statorOp:Math.min(ex.statorOp,0.55),rotorAngle:-ex.rot,em:{angle:-ex.rot+lerp(90,180,ex.fwk),alpha:1},wobble:instab,cancel:ex.fwk,hud:{type:'fw',speed:ex.speedNow,emf,limit:(!ex.fw&&target>130)?1:0,warn:instab},labels:ex.labels?{em:1,cancel:ex.fwk}:{}}; }
  return Object.assign({},DEF,st); }

/* ================= APP ================= */
let stageScale=1; const stage=document.getElementById('stage'), stageBox=document.getElementById('stageBox');
if(isRender) document.documentElement.classList.add('render');
function fit(){ if(isRender){ stageScale=1; stage.style.transform='none'; return; } stageScale=stageBox.clientWidth/1920; stage.style.transform=`scale(${stageScale})`; }
addEventListener('resize',fit); fit();
const fade=document.createElement('div'); fade.style.cssText='position:absolute;inset:0;background:#0b1220;pointer-events:none;opacity:0'; document.getElementById('view').appendChild(fade);
const $=id=>document.getElementById(id);
const mode={kind:'tour'};
const progEls=TOUR.map(s=>{ const d=document.createElement('div'); d.style.flex=String(s.dur); const i=document.createElement('i'); d.appendChild(i); $('prog').appendChild(d); return d; });
let curScene=-1, curCap='', curKey='';
function setPanel(sc,key){ if(curKey===key) return; curKey=key; $('quote').textContent='“'+sc.quote+'”'; $('bullets').innerHTML=sc.bullets.map(b=>`<li>${b[1].replace(/&/g,'&amp;').replace(/</g,'&lt;')}</li>`).join(''); }
function setBullets(sc,lt){ const lis=$('bullets').children; let curIdx=-1; sc.bullets.forEach((b,k)=>{ if(lt>=b[0]) curIdx=k; });
  [...lis].forEach((li,k)=>{ const t=sc.bullets[k][0]; li.classList.toggle('hide',lt<t); li.classList.toggle('cur',k===curIdx&&sc.bullets.some(x=>x[0]>0)); }); }
function setText(id,v){ const e=$(id); if(e._v!==v){ e.textContent=v; e._v=v; } }
function renderAt(Tg){
  Tg=clamp(Tg,0,TTOTAL-0.001); let i=TOUR.length-1; for(let k=0;k<TOUR.length;k++){ if(Tg<TSTART[k]+TOUR[k].dur){ i=k; break; } }
  const sc=TOUR[i], lt=Tg-TSTART[i];
  const st=Object.assign({},DEF,sc.state(lt)); apply(st,Tg); placeCamera(camAt(sc.cam,lt)); renderer.render(scene,camera); drawHUD(st);
  fade.style.opacity=String(Math.max(1-clamp(lt/0.6),clamp((lt-(sc.dur-0.45))/0.45)));
  setText('badge',String(i)); setText('title',sc.title); setPanel(sc,'t'+i); setBullets(sc,lt);
  let cap=sc.steps[0][1]; for(const s of sc.steps) if(lt>=s[0]) cap=s[1]; setText('captext',cap);
  progEls.forEach((d,k)=>{ const f=clamp((Tg-TSTART[k])/TOUR[k].dur); d.firstChild.style.width=(f*100)+'%'; d.classList.toggle('on',k===i); });
}
window.renderAt=renderAt; window.TTOTAL=TTOTAL;
function exploreFrame(dt){ const st=exploreState(dt); apply(st,ex.clock); placeCamera(cam); renderer.render(scene,camera); drawHUD(st); fade.style.opacity='0';
  const sc=TOUR[EXPLORE[ex.name].scene]; setText('badge','3D'); setText('title','직접 탐색 · '+ex.name); setPanel(sc,'e'+ex.name); [...$('bullets').children].forEach(li=>{ li.classList.remove('hide'); li.classList.remove('cur'); });
  setText('captext',EXPLORE[ex.name].cap); }
if(!isRender){
  let T=0, playing=false, last=null;
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  TOUR.forEach((s,k)=>{ const b=document.createElement('button'); b.textContent=s.short; b.onclick=()=>{ toTour(); T=TSTART[k]+0.01; }; $('chips').appendChild(b); });
  Object.keys(EXPLORE).forEach(n=>{ const b=document.createElement('button'); b.textContent=n; b.onclick=()=>toExplore(n); $('modes').appendChild(b); });
  function toTour(){ mode.kind='tour'; document.documentElement.classList.remove('explore'); [...$('modes').children].forEach(x=>x.classList.remove('on')); lastT=null; }
  function toExplore(n){ mode.kind='explore'; playing=false; $('play').textContent='▶ 재생'; ex.name=n; document.documentElement.classList.add('explore');
    [...$('modes').children].forEach(x=>x.classList.toggle('on',x.textContent===n)); Object.assign(cam,{az:n==='구조'?1.15:0.6,el:0.3,dist:n==='구조'?19:12,tx:0,ty:0,tz:n==='구조'?0:0}); lastT=null; }
  $('play').onclick=()=>{ if(mode.kind!=='tour') toTour(); playing=!playing; if(playing&&T>=TTOTAL-0.05) T=0; $('play').textContent=playing?'⏸ 일시정지':'▶ 재생'; };
  $('seek').oninput=()=>{ toTour(); T=$('seek').value/1000*TTOTAL; lastT=null; };
  $('s_speed').oninput=e=>ex.speed=+e.target.value; $('s_op').oninput=e=>ex.statorOp=+e.target.value; $('s_ex').oninput=e=>ex.explode=+e.target.value; $('s_vel').oninput=e=>ex.vel=+e.target.value;
  $('b_fw').onclick=e=>{ ex.fw=!ex.fw; e.target.textContent='약계자 제어: '+(ex.fw?'켬':'끔'); e.target.classList.toggle('on',ex.fw); };
  $('b_lab').onclick=e=>{ ex.labels=!ex.labels; e.target.textContent='라벨: '+(ex.labels?'켬':'끔'); e.target.classList.toggle('on',ex.labels); };
  $('b_view').onclick=()=>Object.assign(cam,{az:0,el:0.02,dist:10.5,tx:0,ty:0,tz:0});
  addEventListener('keydown',e=>{ if(e.code==='Space'&&!(e.target instanceof HTMLInputElement)){ e.preventDefault(); $('play').click(); } });
  function loop(ts){ const dt=last==null?0:Math.min(0.1,(ts-last)/1000); last=ts;
    if(mode.kind==='tour'){ if(playing){ T+=dt; if(T>=TTOTAL){ T=TTOTAL-0.01; playing=false; $('play').textContent='▶ 재생'; } } renderAt(T); $('seek').value=Math.round(T/TTOTAL*1000); $('time').textContent=fmt(T)+' / '+fmt(TTOTAL); }
    else exploreFrame(dt);
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
}

</script>
</body>
</html>
