<script>
{
const MIS=[
 ['말하는 사람 vs 효과 받는 사람','대리에서는 의사표시를 한 대리인에게 법률효과가 생긴다.','의사표시는 대리인이 하지만, 법률효과는 본인에게 귀속돼요. 둘이 “분리”되는 것이 대리의 핵심.','“실제로 의사표시를 하는 자와 그 법률효과가 귀속되는 자가 분리되므로”','말은 대리인이, 효과는 본인이!'],
 ['임의대리 vs 법정대리','임의대리에서는 법률 규정에 따라 대리권이 자동으로 주어진다.','임의대리는 본인의 의사(수권행위)로 대리권이 생기고, 법률 규정에 따른 것은 법정대리예요.','“임의대리에서는 본인이 대리인에게 대리권을 수여하는 수권행위에 의해 대리권이 발생한다.”','임의 = 내 마음(본인 의사) / 법정 = 법이 정함'],
 ['현명은 누구에게?','현명은 대리인이 본인에게 “당신을 위해 하겠다”고 알리는 것이다.','현명은 대리인이 상대방에게 본인을 위한 행위임을 표시하는 것이에요. 상대방이 효과가 누구에게 가는지 알게 하려는 것.','“대리인은 상대방에게 … 본인을 위해 법률행위를 한다는 것을 표시하는 ‘현명’을 하여야 한다.”','현명(顯名) = 상대방 앞에서 본인의 이름을 드러냄'],
 ['현명이 없으면 무조건 무효?','현명을 하지 않으면 법률효과는 절대 본인에게 귀속되지 않는다.','현명이 없더라도 상대방이 대리 행위임을 알 수 있었다면 예외적으로 본인에게 귀속돼요.','“다만 현명이 없었더라도 … 상대방이 알 수 있는 경우에는 예외적으로 … 본인에게 귀속된다.”','원칙(현명 필요) + 예외(상대방이 알 수 있었음)'],
 ['자기계약 vs 쌍방대리','자기계약은 한 명의 대리인이 양측 당사자를 모두 대리하는 것이다.','그건 쌍방대리예요. 자기계약은 대리인이 본인을 대리하면서 동시에 자기가 그 상대방이 되는 경우.','“자기계약은 … 동시에 그 법률행위의 상대방이 되는 경우이고 쌍방대리는 … 양측 당사자를 모두 대리하는 경우”','자기계약 = 대리인 ‘자기’가 상대방 / 쌍방대리 = ‘양쪽’ 다 대리'],
 ['예외 허용의 조건','본인에게 이익이 된다면 새 조건을 정하는 자기계약도 허용된다.','지문의 예외는 ① 새 조건·이해관계 조정이 아닌 기존 의무 실현에 가까울 때, ② 본인이 별도로 허락했을 때뿐이에요.','“새로운 계약 조건을 정하거나 이해관계를 조정하는 경우가 아닌 기존의 의무를 실현하는 것에 가까울 때” “본인이 별도로 허락한 경우”','예: 이미 정해진 채무를 그대로 갚기 → 위험이 작아서 허용'],
 ['체약대리상 vs 중개대리상','중개대리상도 본인의 명의로 계약을 체결한다.','중개대리상은 거래를 알선할 뿐 의사표시도 계약도 하지 않아요. 본인 명의로 계약을 대신 체결하는 것은 체약대리상.','“중개대리상은 거래를 알선할 뿐 본인을 대신하여 의사표시를 하거나 계약하지 않는다.”','체약 = 계약 체결 / 중개 = 소개·알선'],
 ['위탁매매인: 명의와 계산','위탁매매인이 맺은 계약의 이익은 위탁매매인에게, 당사자는 위탁자이다.','정반대! 계약 당사자(명의)는 위탁매매인, 이익과 손해(계산)는 위탁자에게 가요.','“‘자기 명의로써’ … 위탁매매인이 계약 당사자가 되어 … ‘타인의 계산으로’ … 이익과 손해가 위탁자에게 귀속된다”','이름(명의)은 위탁매매인, 주머니(계산)는 위탁자'],
 ['권리 짝짓기','개입권은 위탁자의 이익을 보호하는 방안이고, 유치권은 위탁매매인에게만 있다.','유치권은 대리상·위탁매매인 모두, 보상청구권은 대리상, 개입권은 위탁매매인의 권리예요. 이 권리들은 보조상의 영업활동을 보호하려는 것이에요. 개입권을 행사해도 보수 청구 가능.','“상법은 본인이나 위탁자의 이익뿐 아니라 보조상의 영업활동을 보호하기 위하여도 다양한 권리를 인정한다.”','유치권(둘 다) · 보상(대리상) · 개입(위탁매매인)']
];

 {t:'세 주체',k:'mc',q:'지민이 삼촌에게 노트북 구매를 맡겼고, 삼촌이 판매자와 계약했다. ‘상대방’은 누구일까?',o:['지민','삼촌','판매자'],a:'판매자',why:'상대방 = 대리인과 거래하는 당사자. 지민은 본인, 삼촌은 대리인이에요.',src:'대리인과 거래하는 당사자를 상대방이라고 한다.'},

 {t:'대리권',k:'ox',q:'대리권에는 상대방의 의사표시를 ‘받는’ 자격도 포함된다.',a:'O',why:'대리권은 본인을 위해 의사표시를 “하거나 받음으로써” 효과를 본인에게 귀속시키는 자격이에요.',src:'대리인이 본인을 위하여 상대방에게 의사표시를 하거나 받음으로써 본인에게 법률효과를 귀속시키는 법률상의 자격'},

 {t:'현명주의',k:'ox',q:'현명이 없었더라도 상대방이 대리 행위임을 알 수 있었다면, 효과는 본인에게 귀속된다.',a:'O',why:'현명주의의 예외예요.',src:'다만 현명이 없었더라도 … 상대방이 알 수 있는 경우에는 예외적으로 그 행위의 법률효과가 본인에게 귀속된다.'},
 {t:'현명주의',k:'mc',q:'현명주의가 필요한 이유로 지문에 나온 것은?',o:['대리인의 보수를 정하기 위해','법률효과가 귀속되는 자가 누구인지 상대방이 알 수 있게 하려고','본인이 대리인을 감시하기 위해'],a:'법률효과가 귀속되는 자가 누구인지 상대방이 알 수 있게 하려고',why:'현명주의는 상대방이 진짜 거래 상대(효과 귀속자)를 알게 해 줘요.',src:'이는 법률효과가 귀속되는 자가 누구인지 상대방이 알 수 있게 한다.'},

 {t:'자기계약·쌍방대리',k:'mc',q:'삼촌이 지민의 대리인이면서, 자기 소유 노트북을 지민에게 파는 계약을 맺었다.',o:['자기계약','쌍방대리','문제없는 대리'],a:'자기계약',why:'대리인 자신이 그 계약의 상대방이 되는 경우 = 자기계약 (원칙적 금지).',src:'자기계약은 대리인이 본인을 대신해 법률행위를 하면서 동시에 그 법률행위의 상대방이 되는 경우'},

 {t:'권리',k:'cls',q:'유치권 (수수료·비용을 못 받으면 물건을 돌려주지 않을 수 있는 권리)',a:'둘 다',why:'대리상과 위탁매매인 모두 가져요. (21번 ③은 적절)',src:'대리상과 위탁매매인은 … 물건 등을 돌려주지 않을 수 있는 유치권을 가진다.'},

 {t:'권리',k:'ox',q:'위탁매매인이 개입권을 행사하면 위탁자에게 보수를 청구할 수 없다.',a:'X',why:'개입권을 행사한 경우에도 보수 청구가 가능해요.',src:'이 경우에도 위탁매매인은 위탁자에게 보수를 청구할 수 있다.'},
 {t:'대리상',k:'cls',q:'허락 없이 자기나 제3자의 이익을 위해 본인의 영업 부류에 속한 거래를 해서는 안 됨',a:'대리상',why:'대리상의 신뢰 의무로 지문에 나와요.',src:'본인의 허락 없이 대리상 자신이나 제3자의 이익을 위해 본인의 영업 부류에 속한 거래를 하는 등 신뢰를 해치는 행위를 해서는 안 된다.'},
 {t:'위탁매매인',k:'cls',q:'매매를 마친 뒤 지체없이 알리고 계산서를 제출할 의무',a:'위탁매매인',why:'계산서 제출은 위탁매매인의 의무예요. (대리상도 지체없이 통지할 의무는 있지만 계산서 제출은 위탁매매인에 대해 나와요.)',src:'위탁매매인은 위탁받은 매매를 마친 때에는 그 내용을 지체없이 위탁자에게 알리고, 계산서를 제출하여야 한다.'},
 {t:'보조상',k:'cls',q:'다른 상인의 영업활동을 보조하는 독립된 상인',a:'둘 다',why:'대리상과 위탁매매인 모두 독립된 상인인 보조상이에요.',src:'이들은 모두 독립된 상인이라는 점은 같지만'},
 {t:'사례',k:'mc',q:'22번 <보기>: 을이 B를 위해 자기 명의로 구리를 매입했다. 이 거래의 이익은 누구에게?',o:['을','B','A'],a:'B',why:'을은 위탁매매인(자기 명의, B의 계산) → 이익은 위탁자 B에게. (22번 ⑤가 적절하지 않음)',src:'그 거래의 이익과 손해가 위탁자에게 귀속된다'},
 {t:'사례',k:'mc',q:'22번 <보기>: 갑이 A의 명의로 을과 계약했다. 이 계약의 당사자(갑 쪽)는?',o:['갑','A','B'],a:'A',why:'갑은 A의 체약대리상 → 본인 A가 계약 당사자.',src:'체약대리상은 … 본인의 명의로써 의사표시를 하고 그 법률효과가 직접 본인에게 귀속된다.'},
 {t:'어휘',k:'mc',q:'“비용과 위험 부담이 ⓐ따를 수 있다”의 ‘따르다’와 의미가 가장 가까운 것은?',o:['이 일에는 많은 어려움이 따를 것이다.','선생님의 권유에 따라 공부를 시작하였다.','머리 좋기로는 내 친구를 따를 사람이 없다.'],a:'이 일에는 많은 어려움이 따를 것이다.',why:'‘어떤 일이 다른 일과 더불어 일어나다’의 뜻이에요. (23번 ①)',src:'모든 영업활동을 직접 수행하는 데에 비용과 위험 부담이 ⓐ따를 수 있다.'}
];
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#cards').innerHTML=MIS.map((m,i)=>`<div class="card" id="mc${i}"><div class="t">${i+1}. ${esc(m[0])}</div><div class="wrong">✗ ${esc(m[1])}</div>
  <div class="right"><div class="ok">○ ${esc(m[2])}</div><div class="src">지문: ${esc(m[3])}</div><div class="tip">기억 팁: ${esc(m[4])}</div></div>
  <button data-i="${i}">어디가 틀렸을까? 바로잡기 보기</button></div>`).join('');
$('#cards').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; const c=b.parentElement; c.classList.toggle('open'); b.textContent=c.classList.contains('open')?'접기':'어디가 틀렸을까? 바로잡기 보기';});

const TAGS=['전체',...new Set(Q.map(q=>q.t))];
let pool=[],idx=0,answered=false,wrong=[],stats={},filter='전체';
function opts(q){ return q.k==='ox'?['O','X']:q.k==='cls'?['대리상','위탁매매인','둘 다']:q.o; }
function start(list){ pool=list.slice(); idx=0; wrong=[]; stats={}; render(); }
function render(){
  const pf=$('#progfill'), pt=$('#progtxt');
  if(idx>=pool.length){ pf.style.width='100%'; pt.textContent=`${pool.length}/${pool.length}`; return result(); }
  pf.style.width=(idx/pool.length*100)+'%'; pt.textContent=`${idx+1}/${pool.length}`;
  const q=pool[idx]; answered=false;
  const lab=q.k==='ox'?'O / X':q.k==='cls'?'누구의 권리·의무일까?':'고르기';
  $('#quiz').innerHTML=`<span class="tag">${esc(q.t)} · ${lab}</span><div class="q">${esc(q.q)}</div>
   <div class="opts">${opts(q).map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fbx"></div>`;
}
function result(){
  const total=pool.length, right=total-wrong.length;
  const rows=Object.entries(stats).map(([t,[r,n]])=>`<tr><td class="${r<n?'weak':''}">${esc(t)}${r<n?' (다시 보기)':''}</td><td class="n">${r} / ${n}</td></tr>`).join('');
  $('#quiz').innerHTML=`<div class="res"><h4>${right} / ${total} 정답</h4>
   <p>${wrong.length?'빨간 항목이 아직 헷갈리는 개념이에요. 틀린 문제만 다시 풀어 보세요.':'모두 맞혔어요! 헷갈리던 지점이 확실히 정리됐네요.'}</p>
   <table><tr><th>개념</th><th style="text-align:right">맞힌 수</th></tr>${rows}</table>
   <div class="nav">${wrong.length?'<button id="retry">틀린 문제만 다시 풀기</button>':''}<button id="again">처음부터 다시</button></div></div>`;
  const w=wrong.slice(); if($('#retry')) $('#retry').onclick=()=>start(w); $('#again').onclick=()=>start(cur());
}
function cur(){ return filter==='전체'?Q:Q.filter(q=>q.t===filter); }
$('#quiz').addEventListener('click',e=>{
  const b=e.target.closest('button[data-o]');
  if(b&&!answered){ answered=true; const q=pool[idx], ok=b.dataset.o===q.a;
    [...document.querySelectorAll('#quiz .opts button')].forEach(x=>{ if(x.dataset.o===q.a) x.classList.add('good'); else if(x===b) x.classList.add('badc'); x.disabled=true; });
    const s=stats[q.t]||[0,0]; s[1]++; if(ok) s[0]++; stats[q.t]=s; if(!ok) wrong.push(q);
    $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'정답!':'아쉬워요. 정답: '+esc(q.a)}</b><div>${esc(q.why)}</div><div class="src">지문 근거: “${esc(q.src)}”</div></div>
      <div class="nav"><button id="nextq">${idx+1<pool.length?'다음 문제 →':'결과 보기'}</button></div>`;
    $('#nextq').focus(); return; }
  if(e.target.id==='nextq'){ idx++; render(); }
});
$('#filters').innerHTML=TAGS.map(t=>`<button data-t="${esc(t)}" class="${t==='전체'?'on':''}">${esc(t)}</button>`).join('');
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; filter=b.dataset.t; [...$('#filters').children].forEach(x=>x.classList.toggle('on',x===b)); start(cur());});
start(Q);
}

<script>
'use strict';
const W = 1920, H = 1080;
const FONT = '"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const C = {
  bg:'#0b1220', panel:'#121b2d', panel2:'#1a2640', line:'#2b3a57', text:'#e5e7eb', sub:'#94a3b8',
  N:'#ef4444', S:'#3b82f6', field:'#fde047', A:'#fb923c', B:'#4ade80', Cc:'#c084fc',
  accent:'#38bdf8', stator:'#4b5b74', statorDark:'#3a4860', rotor:'#2a3547', gold:'#fbbf24', good:'#34d399', bad:'#f87171'
};
const PH = {A:C.A, B:C.B, C:C.Cc};
const D2R = Math.PI/180;
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const fin = (lt,s,d=0.8)=>ease((lt-s)/d);
const fout = (lt,s,d=0.8)=>1-ease((lt-s)/d);
const lerp = (a,b,t)=>a+(b-a)*t;
const P = (cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R), cy-r*Math.sin(deg*D2R)];
const font = (sz,w=500)=>`${w} ${sz}px ${FONT}`;

function txt(ctx,s,x,y,o={}){
  const {size=28,color=C.text,align='left',base='alphabetic',weight=500,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=font(size,weight); ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline=base; ctx.fillText(s,x,y); ctx.restore();
}
function wrap(ctx,s,maxW){
  const out=[];
  for(const para of s.split('\n')){

/* ================= FRAME ================= */
const STARTS=[]; let TOTAL=0; for(const s of SCENES){STARTS.push(TOTAL); TOTAL+=s.dur;}
function sceneAt(T){ let i=SCENES.length-1; for(let k=0;k<SCENES.length;k++){ if(T<STARTS[k]+SCENES[k].dur){i=k;break;} } return [i,T-STARTS[i]]; }

function drawPanel(ctx,s,lt){
  const x=1190,y=130,w=690,h=770;
  box(ctx,x,y,w,h,{fill:C.panel,stroke:C.line,r:18});
  txt(ctx,'지문 속 근거',x+30,y+50,{size:24,weight:700,color:C.accent});
  ctx.save(); ctx.font=font(23,400);
  const qh=para(ctx,s.quote.startsWith('“')?s.quote:'“'+s.quote+'”',x+30,y+70,w-60,{size:23,lh:1.55,color:'#cbd5e1'});
  ctx.restore();
  let yy=y+70+qh+30;
  ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+30,yy-12); ctx.lineTo(x+w-30,yy-12); ctx.stroke();
  txt(ctx,'핵심 정리',x+30,yy+28,{size:24,weight:700,color:C.gold});
  yy+=50;
  for(const [t,b] of s.bullets){
    const a=fin(lt,t,0.7); if(a<=0) continue;
    const cur=lt>=t && (s.bullets.find(([t2])=>t2>t)?.[0]??1e9)>lt;
    ctx.save(); ctx.globalAlpha*=a;
    if(cur){box(ctx,x+18,yy-6,w-36,0+measureLines(ctx,b,w-90,25)*25*1.45+12,{fill:'rgba(56,189,248,.12)',stroke:null,r:10});}
    ctx.beginPath(); ctx.arc(x+40,yy+17,6,0,Math.PI*2); ctx.fillStyle=cur?C.accent:'#64748b'; ctx.fill();
    const hgt=para(ctx,b,x+60,yy,w-90,{size:25,lh:1.45,weight:cur?700:400,color:cur?'#fff':'#cbd5e1'});
    ctx.restore();
    yy+=hgt+14;
  }
}
function measureLines(ctx,s,maxW,size){ctx.save(); ctx.font=font(size,700); const n=wrap(ctx,s,maxW).length; ctx.restore(); return n;}

function renderAt(T){
  const ctx=document.getElementById('cv').getContext('2d');
  T=clamp(T,0,TOTAL-0.001);
  const [i,lt]=sceneAt(T); const s=SCENES[i];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  const bgG=ctx.createRadialGradient(600,500,100,600,500,1100); bgG.addColorStop(0,'#101a30'); bgG.addColorStop(1,'#0a101d'); ctx.fillStyle=bgG; ctx.fillRect(0,0,W,H);
  // header
  if(i>0) badge(ctx,80,62,String(i),'#0ea5e9',{r:32,size:32});
  txt(ctx,s.title,i>0?130:60,78,{size:42,weight:900});
  txt(ctx,HEADER_TAG,1880,74,{size:20,align:'right',color:C.sub});
  ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(40,112); ctx.lineTo(1880,112); ctx.stroke();
  // scene body
  ctx.save();
  const sceneFade=fin(lt,0,0.6)*fout(lt,s.dur-0.45,0.45);
  ctx.globalAlpha=sceneFade;
  ctx.beginPath(); s.full?ctx.rect(0,114,W,800):ctx.rect(30,120,1140,790); ctx.clip();
  s.draw(ctx,lt);
  ctx.restore();
  if(!s.full){ ctx.save(); ctx.globalAlpha=sceneFade; drawPanel(ctx,s,lt); ctx.restore(); }
  // caption
  let cap=s.steps[0], ci=0; s.steps.forEach((st,k)=>{if(lt>=st[0]){cap=st;ci=k;}});
  box(ctx,40,920,1840,120,{fill:'rgba(15,23,42,.95)',stroke:C.line,r:16});
  const ca=fin(lt,cap[0],0.5)*sceneFade;
  ctx.save(); ctx.font=font(33,500); const lines=wrap(ctx,cap[1],1760); ctx.restore();
  const lh=46, y0=980-(lines.length-1)*lh/2;
  lines.forEach((l,k)=>txt(ctx,l,W/2,y0+k*lh+12,{size:33,weight:500,align:'center',alpha:ca}));
  // progress
  const px=40,pw=1840,py=1056;
  SCENES.forEach((sc,k)=>{const x=px+pw*STARTS[k]/TOTAL, w=pw*sc.dur/TOTAL-4; box(ctx,x,py,w,10,{fill:'#1f2937',stroke:null,r:5});
    const f=clamp((T-STARTS[k])/sc.dur); if(f>0) box(ctx,x,py,Math.max(6,w*f),10,{fill:k===i?C.accent:'#2f6f8f',stroke:null,r:5});});
}

/* ================= PLAYER ================= */
const isRender=/[?&]render/.test(location.search);
window.renderAt=renderAt; window.TOTAL=TOTAL; window.STARTS=STARTS;
if(isRender){ document.documentElement.classList.add('render'); }
else {
  let T=0, playing=false, last=null;
  const btn=document.getElementById('play'), seek=document.getElementById('seek'), time=document.getElementById('time'), chips=document.getElementById('chips');
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  SCENES.forEach((s,k)=>{const b=document.createElement('button'); b.textContent=s.short; b.onclick=()=>{T=STARTS[k]+0.01; draw();}; chips.appendChild(b);});
  function draw(){ renderAt(T); seek.value=Math.round(T/TOTAL*1000); time.textContent=fmt(T)+' / '+fmt(TOTAL);
    const [i]=sceneAt(T); [...chips.children].forEach((c,k)=>c.classList.toggle('on',k===i)); }
  function loop(ts){ if(playing){ if(last!=null) T+= (ts-last)/1000; last=ts; if(T>=TOTAL){T=TOTAL-0.01; setPlay(false);} draw(); requestAnimationFrame(loop);} }
  function setPlay(p){ playing=p; btn.textContent=p?'⏸ 일시정지':'▶ 재생'; last=null; if(p){ if(T>=TOTAL-0.05) T=0; requestAnimationFrame(loop);} }
  btn.onclick=()=>setPlay(!playing);
  seek.oninput=()=>{T=seek.value/1000*TOTAL; draw();};
  document.getElementById('prev').onclick=()=>{const [i,lt]=sceneAt(T); T=STARTS[Math.max(0,lt<1.5?i-1:i)]+0.01; draw();};
  document.getElementById('next').onclick=()=>{const [i]=sceneAt(T); T=STARTS[Math.min(SCENES.length-1,i+1)]+0.01; draw();};
  addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('#drill')) return; if(e.code==='Space'){e.preventDefault(); setPlay(!playing);} if(e.code==='ArrowRight'){T=Math.min(TOTAL-0.01,T+5); draw();} if(e.code==='ArrowLeft'){T=Math.max(0,T-5); draw();} });
  (document.fonts?document.fonts.load('700 30px "Noto Sans KR"').catch(()=>{}):Promise.resolve()).then(()=>draw());
  draw();
}
