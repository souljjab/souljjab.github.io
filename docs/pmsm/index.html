<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영구자석 동기전동기의 원리 — 2026 10월 고1 학평 국어 [11~14] 시각화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#060a14;color:#e5e7eb;font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  #wrap{max-width:1600px;margin:0 auto;padding:12px}
  canvas{width:100%;height:auto;display:block;border-radius:10px;background:#0b1220}
  #ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  button{background:#1e293b;color:#e5e7eb;border:1px solid #334155;border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
  button:hover{background:#273449}
  button.on{background:#0ea5e9;border-color:#0ea5e9;color:#04121f;font-weight:700}
  #seek{flex:1;min-width:200px}
  #time{font-variant-numeric:tabular-nums;font-size:14px;color:#94a3b8;min-width:110px;text-align:right}
  #chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .render #ui,.render #chips,.render #note{display:none}
  .render #wrap{padding:0;max-width:none}
  .render canvas{border-radius:0}
  #note{font-size:14px;color:#94a3b8;margin-top:10px;line-height:1.6}
  #note a{color:#38bdf8}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="ui">
    <button id="play">▶ 재생</button>
    <button id="prev">⏮ 이전 장면</button>
    <button id="next">다음 장면 ⏭</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">0:00 / 0:00</span>
  </div>
  <div id="chips"></div>
  <div id="note">스페이스바: 재생/일시정지 · ←/→: 5초 이동 · 장면 버튼으로 원하는 부분부터 볼 수 있어요. <a href="pmsm.mp4">동영상(MP4) 내려받기</a></div>
</div>
<script>
'use strict';
const W = 1920, H = 1080;
const FONT = '"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const C = {
  bg:'#0b1220', panel:'#121b2d', panel2:'#1a2640', line:'#2b3a57', text:'#e5e7eb', sub:'#94a3b8',
  N:'#ef4444', S:'#3b82f6', field:'#fde047', A:'#fb923c', B:'#4ade80', Cc:'#c084fc',
  accent:'#38bdf8', stator:'#4b5b74', statorDark:'#3a4860', rotor:'#2a3547', gold:'#fbbf24', good:'#34d399', bad:'#f87171'
};
const PH = {A:C.A, B:C.B, C:C.Cc};
const D2R = Math.PI/180;
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const fin = (lt,s,d=0.8)=>ease((lt-s)/d);
const fout = (lt,s,d=0.8)=>1-ease((lt-s)/d);
const lerp = (a,b,t)=>a+(b-a)*t;
const P = (cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R), cy-r*Math.sin(deg*D2R)];
const font = (sz,w=500)=>`${w} ${sz}px ${FONT}`;

function txt(ctx,s,x,y,o={}){
  const {size=28,color=C.text,align='left',base='alphabetic',weight=500,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=font(size,weight); ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline=base; ctx.fillText(s,x,y); ctx.restore();
}
function wrap(ctx,s,maxW){
  const out=[];
  for(const para of s.split('\n')){
    const words=para.split(' '); let line='';
    for(const w of words){
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width<=maxW){line=test;continue;}
      if(line) out.push(line);
      if(ctx.measureText(w).width>maxW){ // break long word by chars
        let cur='';
        for(const ch of w){ if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;} else cur+=ch; }
        line=cur;
      } else line=w;
    }
    out.push(line);
  }
  return out;
}
function para(ctx,s,x,y,maxW,o={}){
  const {size=26,lh=1.55,color=C.text,weight=400,alpha=1,align='left'}=o;
  ctx.save(); ctx.font=font(size,weight);
  const lines=wrap(ctx,s,maxW);
  ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*size*lh));
  ctx.restore();
  return lines.length*size*lh;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrow(ctx,x1,y1,x2,y2,o={}){
  const {color='#fff',width=4,head=16,alpha=1,dash=null}=o;
  if(alpha<=0) return;
  const a=Math.atan2(y2-y1,x2-x1), len=Math.hypot(x2-x1,y2-y1);
  const hh=Math.min(head,len*0.6);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-Math.cos(a)*hh*0.8,y2-Math.sin(a)*hh*0.8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hh*Math.cos(a-0.45),y2-hh*Math.sin(a-0.45));
  ctx.lineTo(x2-hh*Math.cos(a+0.45),y2-hh*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// arc arrow in math degrees from a1 to a2 (direction follows sign of a2-a1)
function arcArrow(ctx,cx,cy,r,a1,a2,o={}){
  const {color='#fff',width=4,head=16,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap='round';
  const dir=Math.sign(a2-a1)||1; const back=(head*0.8/r)/D2R*dir;
  ctx.beginPath(); ctx.arc(cx,cy,r,-a1*D2R,-(a2-back)*D2R,dir>0); ctx.stroke();
  const [ex,ey]=P(cx,cy,r,a2); const tang=(a2*D2R)+dir*Math.PI/2; // direction of motion (math)
  const tx=Math.cos(tang), ty=-Math.sin(tang); const ang=Math.atan2(ty,tx);
  ctx.beginPath(); ctx.moveTo(ex,ey);
  ctx.lineTo(ex-head*Math.cos(ang-0.45),ey-head*Math.sin(ang-0.45));
  ctx.lineTo(ex-head*Math.cos(ang+0.45),ey-head*Math.sin(ang+0.45)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function badge(ctx,x,y,label,color,o={}){
  const {r=24,alpha=1,dashed=false,size=26,fill=null}=o;
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=fill||color; ctx.fill();
  if(dashed){ctx.setLineDash([5,4]); ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();}
  ctx.restore();
  txt(ctx,label,x,y+1,{size,weight:900,align:'center',base:'middle',alpha,color:'#fff'});
}
// symbols ⊙ / ⊗
function curSym(ctx,x,y,r,out,o={}){
  const {alpha=1,color='#fff',bg='#0b1220'}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.lineWidth=Math.max(2,r*0.16); ctx.strokeStyle=color; ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=color;
  if(out){ ctx.beginPath(); ctx.arc(x,y,r*0.28,0,Math.PI*2); ctx.fill(); }
  else { const k=r*0.62; ctx.beginPath(); ctx.moveTo(x-k,y-k); ctx.lineTo(x+k,y+k); ctx.moveTo(x+k,y-k); ctx.lineTo(x-k,y+k); ctx.stroke(); }
  ctx.restore();
}
// polyline helper with dash animation
function poly(ctx,pts,o={}){
  const {color=C.field,width=2.5,alpha=1,dash=null,offset=0}=o; if(alpha<=0||pts.length<2) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
  if(dash){ctx.setLineDash(dash); ctx.lineDashOffset=offset;}
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke();
  ctx.restore();
}
function headAlong(ctx,pts,frac,o={}){
  if(pts.length<4) return;
  const {color=C.field,size=13,alpha=1}=o;
  let total=0; const seg=[]; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); seg.push(d); total+=d;}
  let target=total*frac, i=0; while(i<seg.length-1&&target>seg[i]){target-=seg[i];i++;}
  const a=pts[i], b=pts[i+1]; const t=seg[i]?target/seg[i]:0; const x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x+size*0.6*Math.cos(ang),y+size*0.6*Math.sin(ang));
  ctx.lineTo(x-size*0.6*Math.cos(ang)+size*0.5*Math.cos(ang+Math.PI/2),y-size*0.6*Math.sin(ang)+size*0.5*Math.sin(ang+Math.PI/2));
  ctx.lineTo(x-size*0.6*Math.cos(ang)-size*0.5*Math.cos(ang+Math.PI/2),y-size*0.6*Math.sin(ang)-size*0.5*Math.sin(ang+Math.PI/2));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function box(ctx,x,y,w,h,o={}){
  const {fill=C.panel2,stroke=C.line,r=14,alpha=1,lw=2}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; rr(ctx,x,y,w,h,r); ctx.fillStyle=fill; ctx.fill(); if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();} ctx.restore();
}

/* ================= BAR MAGNET FIELD (scene 1) ================= */
function magnetCharges(m){ // m:{x,y,L,h,dir}  dir=+1 -> N on right
  return [{x:m.x+m.dir*m.L*0.72,y:m.y,q:1},{x:m.x-m.dir*m.L*0.72,y:m.y,q:-1}];
}
function insideS(m,x,y){ // inside body and in S half
  if(Math.abs(y-m.y)>m.h/2+2||Math.abs(x-m.x)>m.L+2) return false;
  return (x-m.x)*m.dir<0;
}
function traceLines(mags,bounds){
  const charges=[].concat(...mags.map(magnetCharges));
  const lines=[];
  for(const m of mags){
    const nx=m.x+m.dir*m.L, ny=m.y;
    const angs=[-150,-128,-108,-90,-72,-55,-38,-20,20,38,55,72,90,108,128,150];
    for(const a of angs){
      const ang=(m.dir>0?0:180)+(m.dir>0?a:-a);
      let x=m.x+m.dir*m.L*0.72+8*Math.cos(ang*D2R), y=ny+8*Math.sin(ang*D2R);
      const pts=[[x,y]];
      for(let i=0;i<1600;i++){
        let ex=0,ey=0;
        for(const c of charges){const dx=x-c.x,dy=y-c.y; const r2=dx*dx+dy*dy+20; const r3=r2*Math.sqrt(r2); ex+=c.q*dx/r3; ey+=c.q*dy/r3;}
        const n=Math.hypot(ex,ey)||1; x+=5*ex/n; y+=5*ey/n; pts.push([x,y]);
        if(x<bounds[0]||x>bounds[2]||y<bounds[1]||y>bounds[3]) break;
        if(i>4&&charges.some(c=>c.q<0&&Math.hypot(x-c.x,y-c.y)<9)) break;
      }
      lines.push(pts);
    }
  }
  return lines;
}
function drawBar(ctx,m,o={}){
  const {alpha=1,glowInner=0}=o; if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha;
  const x0=m.x-m.L, y0=m.y-m.h/2;
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=18;
  rr(ctx,x0,y0,m.L*2,m.h,10); ctx.fillStyle='#000'; ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); rr(ctx,x0,y0,m.L*2,m.h,10); ctx.clip();
  const nLeft=m.dir<0;
  ctx.fillStyle=nLeft?C.N:C.S; ctx.fillRect(x0,y0,m.L,m.h);
  ctx.fillStyle=nLeft?C.S:C.N; ctx.fillRect(m.x,y0,m.L,m.h);
  ctx.restore();
  ctx.restore();
  txt(ctx,nLeft?'N':'S',m.x-m.L*0.6,m.y+2,{size:44,weight:900,align:'center',base:'middle',alpha,color:'#fff'});
  txt(ctx,nLeft?'S':'N',m.x+m.L*0.6,m.y+2,{size:44,weight:900,align:'center',base:'middle',alpha,color:'#fff'});
  if(glowInner>0){ // interior arrow S -> N
    const xs=m.x-m.dir*m.L*0.32, xe=m.x+m.dir*m.L*0.32;
    arrow(ctx,xs,m.y,xe,m.y,{color:'#fff',width:5,head:18,alpha:alpha*glowInner});
  }
}
function fieldScene(ctx,mags,lt,o={}){
  const {alpha=1,bounds=[-500,-400,1700,1500]}=o;
  const lines=traceLines(mags,bounds);
  for(const pts of lines){
    poly(ctx,pts,{color:C.field,width:2.4,alpha:alpha*0.85,dash:[16,10],offset:-lt*45});
    headAlong(ctx,pts,0.42,{alpha,size:15});
  }
}

/* ================= MOTOR CROSS-SECTION ================= */
const SLOTS=[
  {n:'A',a:90,ph:'A',cap:true},{n:'c',a:30,ph:'C',cap:false},{n:'B',a:-30,ph:'B',cap:true},
  {n:'a',a:-90,ph:'A',cap:false},{n:'C',a:-150,ph:'C',cap:true},{n:'b',a:150,ph:'B',cap:false}
];
const PHDIR={A:0,B:-120,C:120}; // field direction (math deg) at centre for +current
function currentsAt(theta){ // theta deg ; returns {A,B,C} in units (max 300)
  return {A:300*Math.sin(theta*D2R), B:300*Math.sin((theta-120)*D2R), C:300*Math.sin((theta+120)*D2R)};
}
function resultant(I){
  let x=0,y=0; for(const k of ['A','B','C']){x+=I[k]*Math.cos(PHDIR[k]*D2R); y+=I[k]*Math.sin(PHDIR[k]*D2R);} return [x,y];
}
function slotCurrent(s,I){ const v=I[s.ph]; return s.cap?v:-v; } // >0 means out of stator (⊙)

function drawMotor(ctx,cx,cy,R,o={}){
  const {rotor=true,rotorAngle=-90,slots='six',I=null,labels=true,alpha=1,hl={},pair=0,em=null,
         fieldGrid=0,regions=0,statorAlpha=1,rotorAlpha=1,symScale=1,lt=0,slotLabels=true,result=0,wobble=0}=o;
  const Rin=R*0.64, Rr=R*0.575;
  ctx.save(); ctx.globalAlpha*=alpha;
  // stator ring
  ctx.save(); ctx.globalAlpha*=statorAlpha;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.arc(cx,cy,Rin,0,Math.PI*2,true);
  const g=ctx.createRadialGradient(cx,cy,Rin,cx,cy,R); g.addColorStop(0,'#5a6b86'); g.addColorStop(1,'#3a475d');
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#8091ad'; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,Rin,0,Math.PI*2); ctx.stroke();
  if(hl.stator){ctx.save(); ctx.globalAlpha*=hl.stator; ctx.lineWidth=8; ctx.strokeStyle=C.accent; ctx.shadowColor=C.accent; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(cx,cy,R+4,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(cx,cy,Rin-2,0,Math.PI*2); ctx.stroke(); ctx.restore();}
  // slots
  if(slots==='many'){
    for(let i=0;i<36;i++){
      const a=90-i*10-5;
      let best=SLOTS[0],bd=999; for(const s of SLOTS){let d=Math.abs(((a-s.a)%360+540)%360-180); if(d<bd){bd=d;best=s;}}
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(-a*D2R);
      ctx.fillStyle='#0b1220'; ctx.fillRect(Rin-2,-R*0.022,R*0.11,R*0.044);
      if(regions>0){ctx.globalAlpha*=regions; ctx.fillStyle=PH[best.ph]; ctx.fillRect(Rin+R*0.015,-R*0.016,R*0.085,R*0.032);}
      ctx.restore();
    }
    if(regions>0){
      for(const s of SLOTS){
        ctx.save(); ctx.globalAlpha*=regions*0.28; ctx.fillStyle=PH[s.ph];
        ctx.beginPath(); ctx.arc(cx,cy,R-3,(-s.a-29)*D2R,(-s.a+29)*D2R); ctx.arc(cx,cy,Rin+R*0.13,(-s.a+29)*D2R,(-s.a-29)*D2R,true); ctx.closePath(); ctx.fill(); ctx.restore();
        const [lx,ly]=P(cx,cy,R*0.86,s.a);
        txt(ctx,s.n,lx,ly+2,{size:R*0.12,weight:900,align:'center',base:'middle',alpha:regions,color:'#fff'});
      }
    }
  } else if(slots==='six'){
    for(const s of SLOTS){
      const w=R*0.15, d=R*0.15;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(-s.a*D2R);
      rr(ctx,Rin-4,-w/2,d+4,w,6); ctx.fillStyle='#0b1220'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle=PH[s.ph]; ctx.globalAlpha*=0.9; ctx.stroke();
      ctx.restore();
      const [sx,sy]=P(cx,cy,Rin+d*0.52,s.a);
      if(I){
        const v=slotCurrent(s,I); const k=Math.abs(v)/300;
        if(k>0.02) curSym(ctx,sx,sy,R*0.05*symScale*(0.55+0.45*k),v>0,{alpha:0.35+0.65*k,color:'#fff'});
        else txt(ctx,'0',sx,sy+1,{size:R*0.06,align:'center',base:'middle',color:C.sub});
      }
      if(slotLabels&&labels){
        const [lx,ly]=P(cx,cy,R+R*0.1,s.a);
        txt(ctx,s.n,lx,ly+2,{size:R*0.11,weight:900,align:'center',base:'middle',color:PH[s.ph]});
      }
    }
  }
  ctx.restore();
  // pair lines
  if(pair>0){
    for(const ph of ['A','B','C']){
      const ss=SLOTS.filter(s=>s.ph===ph); const [x1,y1]=P(cx,cy,Rin+R*0.07,ss[0].a), [x2,y2]=P(cx,cy,Rin+R*0.07,ss[1].a);
      ctx.save(); ctx.globalAlpha*=pair; ctx.strokeStyle=PH[ph]; ctx.lineWidth=4; ctx.setLineDash([12,10]); ctx.lineDashOffset=-lt*30;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
    }
  }
  // gap highlight
  if(hl.gap){ctx.save(); ctx.globalAlpha*=hl.gap; ctx.beginPath(); ctx.arc(cx,cy,Rin,0,Math.PI*2); ctx.arc(cx,cy,Rr,0,Math.PI*2,true); ctx.fillStyle=C.gold; ctx.fill(); ctx.restore();}
  // field grid (from line currents)
  if(fieldGrid>0&&I){
    const wires=SLOTS.map(s=>{const [x,y]=P(cx,cy,Rin+R*0.07,s.a); return {x,y,i:slotCurrent(s,I)};});
    const step=R*0.16;
    for(let gx=-Rin;gx<=Rin;gx+=step) for(let gy=-Rin;gy<=Rin;gy+=step){
      if(Math.hypot(gx,gy)>Rin*0.86) continue;
      const px=cx+gx, py=cy+gy; let bx=0,by=0; // math coords: y up
      for(const w of wires){const dx=px-w.x, dy=-(py-w.y); const r2=dx*dx+dy*dy; bx+=w.i*(-dy)/r2; by+=w.i*dx/r2;}
      const n=Math.hypot(bx,by); if(n<1e-6) continue;
      const L=step*0.62; const ux=bx/n, uy=-by/n;
      arrow(ctx,px-ux*L/2,py-uy*L/2,px+ux*L/2,py+uy*L/2,{color:C.field,width:3,head:11,alpha:fieldGrid*0.9});
    }
  }
  // rotor
  if(rotor){
    ctx.save(); ctx.globalAlpha*=rotorAlpha;
    ctx.beginPath(); ctx.arc(cx,cy,Rr,0,Math.PI*2); ctx.fillStyle=C.rotor; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='#64748b'; ctx.stroke();
    if(hl.rotor){ctx.save(); ctx.globalAlpha*=hl.rotor; ctx.lineWidth=8; ctx.strokeStyle=C.accent; ctx.shadowColor=C.accent; ctx.shadowBlur=20; ctx.beginPath(); ctx.arc(cx,cy,Rr,0,Math.PI*2); ctx.stroke(); ctx.restore();}
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(-rotorAngle*D2R);
    const ml=Rr*0.82, mw=Rr*0.52;
    rr(ctx,-ml,-mw/2,ml*2,mw,8); ctx.save(); ctx.clip();
    ctx.fillStyle=C.S; ctx.fillRect(-ml,-mw/2,ml,mw); ctx.fillStyle=C.N; ctx.fillRect(0,-mw/2,ml,mw); ctx.restore();

function cylinder3D(ctx,lt,alpha){

  const xb=330, xf=880, cy=520, rx=95, ry=260, k=0.64;

  ctx.beginPath(); ctx.moveTo(xb,cy-ry); ctx.lineTo(xf,cy-ry); ctx.moveTo(xb,cy+ry); ctx.lineTo(xf,cy+ry); ctx.stroke();
  // slots along inner surface
  for(let i=0;i<24;i++){

  const top1=E(xf,k,90), top0=E(xb,k,90), bot0=E(xb,k,270), bot1=E(xf,k,270);

  txt(ctx,'전선이 들어감',top1[0]+100,top1[1]-48,{size:24,weight:700,color:C.A});
  txt(ctx,'마주 보는 슬롯으로 나옴',bot1[0]+100,bot1[1]+64,{size:24,weight:700,color:C.A});

function speed5(lt){
  if(lt<9) return 75*ease(lt/9);
  if(lt<52) return 130-55*Math.exp(-(lt-9)/5);
  return lerp(130-55*Math.exp(-43/5),195,ease((lt-52)/11));
}
function weak5(lt){ return lt<47?1:lerp(1,0.45,ease((lt-47)/5)); }
function emf5(lt){ return speed5(lt)/130*95*weak5(lt); }
function angle5(lt){ let a=0; const dt=1/30; for(let t=0;t<lt;t+=dt) a+=speed5(t)*2.4*dt; return a; }
function gauge(ctx,cx,cy,r,v,o={}){
  const {limit=null,alpha=1}=o; ctx.save(); ctx.globalAlpha*=alpha;
  ctx.lineWidth=18; ctx.strokeStyle='#1f2937'; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25); ctx.stroke();
  const f=clamp(v/220); ctx.strokeStyle=C.accent; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*(0.75+1.5*f)); ctx.stroke();
  if(limit){const lf=limit.v/220, a=Math.PI*(0.75+1.5*lf); ctx.save(); ctx.globalAlpha*=limit.alpha; ctx.strokeStyle=C.bad; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(r-28),cy+Math.sin(a)*(r-28)); ctx.lineTo(cx+Math.cos(a)*(r+28),cy+Math.sin(a)*(r+28)); ctx.stroke(); ctx.restore();

  const a=Math.PI*(0.75+1.5*f); ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*(r-22),cy+Math.sin(a)*(r-22)); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
  txt(ctx,'회전 속도',cx,cy+r*0.55,{size:22,align:'center',color:C.sub,alpha});
  txt(ctx,String(Math.round(v)),cx,cy+r*0.55+40,{size:34,weight:900,align:'center',alpha});
}

  yy+=50;
  for(const [t,b] of s.bullets){
    const a=fin(lt,t,0.7); if(a<=0) continue;
    const cur=lt>=t && (s.bullets.find(([t2])=>t2>t)?.[0]??1e9)>lt;
    ctx.save(); ctx.globalAlpha*=a;
    if(cur){box(ctx,x+18,yy-6,w-36,0+measureLines(ctx,b,w-90,25)*25*1.45+12,{fill:'rgba(56,189,248,.12)',stroke:null,r:10});}
    ctx.beginPath(); ctx.arc(x+40,yy+17,6,0,Math.PI*2); ctx.fillStyle=cur?C.accent:'#64748b'; ctx.fill();
    const hgt=para(ctx,b,x+60,yy,w-90,{size:25,lh:1.45,weight:cur?700:400,color:cur?'#fff':'#cbd5e1'});
    ctx.restore();
    yy+=hgt+14;
  }
}
function measureLines(ctx,s,maxW,size){ctx.save(); ctx.font=font(size,700); const n=wrap(ctx,s,maxW).length; ctx.restore(); return n;}

function renderAt(T){
  const ctx=document.getElementById('cv').getContext('2d');
  T=clamp(T,0,TOTAL-0.001);
  const [i,lt]=sceneAt(T); const s=SCENES[i];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  const bgG=ctx.createRadialGradient(600,500,100,600,500,1100); bgG.addColorStop(0,'#101a30'); bgG.addColorStop(1,'#0a101d'); ctx.fillStyle=bgG; ctx.fillRect(0,0,W,H);
  // header
  if(i>0) badge(ctx,80,62,String(i),'#0ea5e9',{r:32,size:32});
  txt(ctx,s.title,i>0?130:60,78,{size:42,weight:900});
  txt(ctx,'2026 10월 고1 학평 국어 [11~14] · 영구자석 동기전동기',1880,74,{size:20,align:'right',color:C.sub});
  ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(40,112); ctx.lineTo(1880,112); ctx.stroke();
  // scene body
  ctx.save();
  const sceneFade=fin(lt,0,0.6)*fout(lt,s.dur-0.45,0.45);
  ctx.globalAlpha=sceneFade;
  ctx.beginPath(); s.full?ctx.rect(0,114,W,800):ctx.rect(30,120,1140,790); ctx.clip();
  s.draw(ctx,lt);
  ctx.restore();
  if(!s.full){ ctx.save(); ctx.globalAlpha=sceneFade; drawPanel(ctx,s,lt); ctx.restore(); }
  // caption
  let cap=s.steps[0], ci=0; s.steps.forEach((st,k)=>{if(lt>=st[0]){cap=st;ci=k;}});
  box(ctx,40,920,1840,120,{fill:'rgba(15,23,42,.95)',stroke:C.line,r:16});
  const ca=fin(lt,cap[0],0.5)*sceneFade;
  ctx.save(); ctx.font=font(33,500); const lines=wrap(ctx,cap[1],1760); ctx.restore();
  const lh=46, y0=980-(lines.length-1)*lh/2;
  lines.forEach((l,k)=>txt(ctx,l,W/2,y0+k*lh+12,{size:33,weight:500,align:'center',alpha:ca}));
  // progress
  const px=40,pw=1840,py=1056;
  SCENES.forEach((sc,k)=>{const x=px+pw*STARTS[k]/TOTAL, w=pw*sc.dur/TOTAL-4; box(ctx,x,py,w,10,{fill:'#1f2937',stroke:null,r:5});
    const f=clamp((T-STARTS[k])/sc.dur); if(f>0) box(ctx,x,py,Math.max(6,w*f),10,{fill:k===i?C.accent:'#2f6f8f',stroke:null,r:5});});
}

/* ================= PLAYER ================= */
const isRender=/[?&]render/.test(location.search);
window.renderAt=renderAt; window.TOTAL=TOTAL; window.STARTS=STARTS;
if(isRender){ document.documentElement.classList.add('render'); }
else {
  let T=0, playing=false, last=null;
  const btn=document.getElementById('play'), seek=document.getElementById('seek'), time=document.getElementById('time'), chips=document.getElementById('chips');
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  SCENES.forEach((s,k)=>{const b=document.createElement('button'); b.textContent=s.short; b.onclick=()=>{T=STARTS[k]+0.01; draw();}; chips.appendChild(b);});
  function draw(){ renderAt(T); seek.value=Math.round(T/TOTAL*1000); time.textContent=fmt(T)+' / '+fmt(TOTAL);
    const [i]=sceneAt(T); [...chips.children].forEach((c,k)=>c.classList.toggle('on',k===i)); }
  function loop(ts){ if(playing){ if(last!=null) T+= (ts-last)/1000; last=ts; if(T>=TOTAL){T=TOTAL-0.01; setPlay(false);} draw(); requestAnimationFrame(loop);} }
  function setPlay(p){ playing=p; btn.textContent=p?'⏸ 일시정지':'▶ 재생'; last=null; if(p){ if(T>=TOTAL-0.05) T=0; requestAnimationFrame(loop);} }
  btn.onclick=()=>setPlay(!playing);
  seek.oninput=()=>{T=seek.value/1000*TOTAL; draw();};
  document.getElementById('prev').onclick=()=>{const [i,lt]=sceneAt(T); T=STARTS[Math.max(0,lt<1.5?i-1:i)]+0.01; draw();};
  document.getElementById('next').onclick=()=>{const [i]=sceneAt(T); T=STARTS[Math.min(SCENES.length-1,i+1)]+0.01; draw();};
  addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); setPlay(!playing);} if(e.code==='ArrowRight'){T=Math.min(TOTAL-0.01,T+5); draw();} if(e.code==='ArrowLeft'){T=Math.max(0,T-5); draw();} });
  (document.fonts?document.fonts.load('700 30px "Noto Sans KR"').catch(()=>{}):Promise.resolve()).then(()=>draw());
  draw();
}
</script>
